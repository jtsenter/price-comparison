name: Scrape Prices

on:
  schedule:
    # Mon and Thu at 8am AEST (22:00 UTC Sun/Wed)
    - cron: '0 22 * * 0,3'
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Trigger source'
        required: false
        default: 'manual'
      item:
        description: 'Single item to refresh (leave empty for full list)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        shell: bash
        run: playwright install chromium --with-deps

      - name: Run scraper
        shell: bash
        run: python scripts/scraper.py "${{ github.event.inputs.trigger || 'scheduled' }}" "${{ github.event.inputs.item || '' }}"

      - name: Commit and push results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "chore: update prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push
