name: Scrape Prices

on:
  schedule:
    # Mon, Wed and Thu at 11am AEST (01:00 UTC) — Wed added to catch AU supermarket
    # specials, which typically change Wednesday.
    - cron: '0 1 * * 1,3,4'
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Trigger source'
        required: false
        default: 'manual'
      item:
        description: 'Single item to refresh (leave empty for full list)'
        required: false
        default: ''
      ww_url:
        description: 'Woolworths product URL for direct fetch (optional)'
        required: false
        default: ''
      coles_url:
        description: 'Coles product URL for direct fetch (optional)'
        required: false
        default: ''

concurrency:
  # QUEUE, don't cancel. With cancel-in-progress:true a second trigger killed the
  # run already in flight - a full scrape 260/284 done was thrown away to restart
  # at 0, and a scrape_archived dispatch (same 'scrape-full' group, since it sets
  # no `item`) died as "Abandoned" 63s in. The killed run also left scrape_progress
  # stuck in latest.json, so the UI strip bounced between the corpse's count, the
  # dispatch-pending message, and the new run's lower count.
  # Queuing lets the in-flight run finish (and clear its own progress) first;
  # GitHub keeps at most one pending run per group, so this can't pile up.
  group: scrape-${{ github.event.inputs.item || 'full' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON: 'C:\Users\jtsen\AppData\Local\Python\pythoncore-3.14-64\python.exe'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 90

    defaults:
      run:
        shell: cmd

    steps:
      - name: Trust workspace (SYSTEM vs user ownership)
        run: git config --global --add safe.directory C:/actions-runner/_work/price-comparison/price-comparison

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: '"%PYTHON%" -m pip install -r requirements.txt'

      - name: Install Playwright browsers
        run: '"%PYTHON%" -m playwright install chromium chromium-headless-shell'

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "%PYTHON%" scripts/scraper.py "${{ github.event.inputs.trigger || 'scheduled' }}" "${{ github.event.inputs.item || '' }}" "${{ github.event.inputs.ww_url || '' }}" "${{ github.event.inputs.coles_url || '' }}"

      - name: Commit and push results
        # Runs even if the scraper step failed. The scraper writes latest.json
        # continuously, so a crash partway through still leaves real prices on
        # disk - and skipping this step (the default on failure) threw all of
        # that away. Four full runs were lost that way: every item had been
        # scraped and the process died on the very last bookkeeping call.
        # `always()` keeps whatever was gathered; a genuinely empty run just
        # produces no diff and commits nothing.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "chore: update prices"
          git pull --no-rebase -X ours origin main
          git push

      - name: Clear stalled scrape_progress
        if: always()
        run: |
          "%PYTHON%" -c "import json; p='docs/data/latest.json'; d=json.load(open(p)); sp=d.pop('scrape_progress',None); sp and open(p,'w').write(json.dumps(d,separators=(',',':')))"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          git diff --cached --quiet || (git pull --no-rebase -X ours origin main && git commit -m "chore: clear stalled scrape_progress" && git push)

  scrape-archived:
    runs-on: self-hosted
    needs: [scrape]
    # Run after the main scrape regardless of whether it succeeded or timed out.
    # Skip when this is a single-item refresh (item input is non-empty), and when
    # it's a retry_misses run - that one exists precisely to avoid full-run
    # request volume, so tacking a whole archived sweep onto it defeats it.
    if: always() && github.event.inputs.item == '' && github.event.inputs.trigger != 'retry_misses'
    timeout-minutes: 60

    defaults:
      run:
        shell: cmd

    steps:
      - name: Trust workspace
        run: git config --global --add safe.directory C:/actions-runner/_work/price-comparison/price-comparison
        continue-on-error: true

      - name: Checkout repo
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Install dependencies
        run: '"%PYTHON%" -m pip install -r requirements.txt >NUL 2>&1'
        continue-on-error: true

      - name: Scrape archived items
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"%PYTHON%" scripts/scraper.py scrape_archived >NUL 2>&1'
        continue-on-error: true

      - name: Commit and push archived results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          git diff --cached --quiet || git commit -m "chore: update archived prices"
          git pull --no-rebase -X ours origin main
          git push
        continue-on-error: true
