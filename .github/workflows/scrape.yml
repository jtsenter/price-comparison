name: Scrape Prices

on:
  schedule:
    # Mon and Thu at 8am AEST (22:00 UTC Sun/Wed)
    - cron: '0 22 * * 0,3'
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Trigger source'
        required: false
        default: 'manual'
      item:
        description: 'Single item to refresh (leave empty for full list)'
        required: false
        default: ''
      ww_url:
        description: 'Woolworths product URL for direct fetch (optional)'
        required: false
        default: ''
      coles_url:
        description: 'Coles product URL for direct fetch (optional)'
        required: false
        default: ''

concurrency:
  group: scrape
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON: 'C:\Users\jtsen\AppData\Local\Python\pythoncore-3.14-64\python.exe'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 90

    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: '"%PYTHON%" -m pip install -r requirements.txt'

      - name: Install Playwright browsers
        run: '"%PYTHON%" -m playwright install chromium chromium-headless-shell'

      - name: Run scraper
        run: |
          "%PYTHON%" scripts/scraper.py "${{ github.event.inputs.trigger || 'scheduled' }}" "${{ github.event.inputs.item || '' }}" "${{ github.event.inputs.ww_url || '' }}" "${{ github.event.inputs.coles_url || '' }}"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "chore: update prices"
          git pull --rebase origin main
          git push
