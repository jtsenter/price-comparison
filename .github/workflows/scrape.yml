name: Scrape Prices

on:
  schedule:
    # Mon and Thu at 8am AEST (22:00 UTC Sun/Wed)
    - cron: '0 22 * * 0,3'
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Trigger source'
        required: false
        default: 'manual'
      item:
        description: 'Single item to refresh (leave empty for full list)'
        required: false
        default: ''

permissions:
  contents: write

env:
  PYTHON: 'C:\Users\jtsen\AppData\Local\Python\pythoncore-3.14-64\python.exe'

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 60

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: '& $env:PYTHON -m pip install -r requirements.txt'

      - name: Install Playwright browsers
        run: '& $env:PYTHON -m playwright install chromium chromium-headless-shell'

      - name: Run scraper
        run: '& $env:PYTHON scripts/scraper.py "${{ github.event.inputs.trigger || ''scheduled'' }}" "${{ github.event.inputs.item || '''' }}"'

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          $timestamp = (Get-Date -UFormat "%Y-%m-%d %H:%M UTC")
          git diff --staged --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update prices $timestamp"
          }
          git pull --rebase origin main
          git push
