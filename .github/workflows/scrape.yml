name: Scrape Prices

on:
  schedule:
    # Mon, Wed and Thu at 11am AEST (01:00 UTC) — Wed added to catch AU supermarket
    # specials, which typically change Wednesday.
    - cron: '0 1 * * 1,3,4'
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Trigger source'
        required: false
        default: 'manual'
      item:
        description: 'Single item to refresh (leave empty for full list)'
        required: false
        default: ''
      ww_url:
        description: 'Woolworths product URL for direct fetch (optional)'
        required: false
        default: ''
      coles_url:
        description: 'Coles product URL for direct fetch (optional)'
        required: false
        default: ''
      scrape_mode:
        description: 'new = only never-priced items; quick = only items whose price moves; full = everything'
        required: false
        default: 'full'
        type: choice
        options: ['full', 'quick', 'new']

concurrency:
  # QUEUE, don't cancel. With cancel-in-progress:true a second trigger killed the
  # run already in flight - a full scrape 260/284 done was thrown away to restart
  # at 0, and a scrape_archived dispatch (same 'scrape-full' group, since it sets
  # no `item`) died as "Abandoned" 63s in. The killed run also left scrape_progress
  # stuck in latest.json, so the UI strip bounced between the corpse's count, the
  # dispatch-pending message, and the new run's lower count.
  # Queuing lets the in-flight run finish (and clear its own progress) first;
  # GitHub keeps at most one pending run per group, so this can't pile up.
  group: scrape-${{ github.event.inputs.item || 'full' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHON: 'C:\Users\jtsen\AppData\Local\Python\pythoncore-3.14-64\python.exe'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: self-hosted
    timeout-minutes: 90

    defaults:
      run:
        shell: cmd

    steps:
      - name: Trust workspace (SYSTEM vs user ownership)
        run: git config --global --add safe.directory C:/actions-runner/_work/price-comparison/price-comparison

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: '"%PYTHON%" -m pip install -r requirements.txt'

      - name: Install Playwright browsers
        run: '"%PYTHON%" -m playwright install chromium chromium-headless-shell'

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "%PYTHON%" scripts/scraper.py "${{ github.event.inputs.trigger || 'scheduled' }}" "${{ github.event.inputs.item || '' }}" "${{ github.event.inputs.ww_url || '' }}" "${{ github.event.inputs.coles_url || '' }}" "${{ github.event.inputs.scrape_mode || 'full' }}"

      - name: Commit and push results
        # Runs even if the scraper step failed. The scraper writes latest.json
        # continuously, so a crash partway through still leaves real prices on
        # disk - and skipping this step (the default on failure) threw all of
        # that away. Four full runs were lost that way: every item had been
        # scraped and the process died on the very last bookkeeping call.
        # `always()` keeps whatever was gathered; a genuinely empty run just
        # produces no diff and commits nothing.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          git diff --cached --quiet || git commit -m "chore: update prices"
          git pull --no-rebase -X ours origin main
          git push

      - name: Clear stalled scrape_progress
        if: always()
        # A handoff-marked progress is NOT stalled - it is the full run holding
        # the pipeline bar for the archived sweep that runs next (scraper.py).
        # That job clears progress unconditionally when it finishes.
        run: |
          "%PYTHON%" -c "import json; p='docs/data/latest.json'; d=json.load(open(p)); sp=d.get('scrape_progress'); (sp is not None and not sp.get('handoff')) and (d.pop('scrape_progress'), open(p,'w').write(json.dumps(d,separators=(',',':'))))"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "chore: clear stalled scrape_progress"
          git pull --no-rebase -X ours origin main
          git push

  scrape-archived:
    runs-on: self-hosted
    needs: [scrape]
    # Run after the main scrape regardless of whether it succeeded or timed out.
    # Skip when this is a single-item refresh (item input is non-empty), and when
    # it's a retry_misses run - that one exists precisely to avoid full-run
    # request volume, so tacking a whole archived sweep onto it defeats it.
    if: always() && github.event.inputs.item == '' && github.event.inputs.trigger != 'retry_misses'
    timeout-minutes: 60

    defaults:
      run:
        shell: cmd

    steps:
      - name: Trust workspace
        run: git config --global --add safe.directory C:/actions-runner/_work/price-comparison/price-comparison
        continue-on-error: true

      - name: Checkout repo
        uses: actions/checkout@v4
        continue-on-error: true

      # actions/checkout pins BOTH jobs to the SHA that triggered the workflow,
      # so this job starts from the repo as it was BEFORE the main scrape ran -
      # it cannot see the "chore: update prices" commit the scrape job just
      # pushed. The archived scraper then appended its run to a stale
      # scrape_log.json, and the `git pull -X ours` below resolved the conflict
      # in favour of that stale copy. Net effect: every main run's log entry was
      # silently erased by the archived sweep that followed it. From 2026-08-08
      # the log showed nothing but 36-item, 2-minute archived rows, while the
      # real runs (293 items, 16m47s on 2026-08-11) were written, committed,
      # pushed, and then overwritten three minutes later.
      # The tree is a fresh checkout here, so there is nothing local to lose.
      - name: Sync to the main scrape's results
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: '"%PYTHON%" -m pip install -r requirements.txt >NUL 2>&1'
        continue-on-error: true

      - name: Scrape archived items
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"%PYTHON%" scripts/scraper.py scrape_archived >NUL 2>&1'
        continue-on-error: true

      - name: Commit and push archived results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "chore: update archived prices"
          git pull --no-rebase -X ours origin main
          git push
        continue-on-error: true

      - name: Refresh third-store prices
        # Chemist Warehouse / Big W / Priceline. Runs HERE because the runner's
        # real Chromium + persistent profile is the only environment with a
        # chance past Big W's edge 403 and Priceline's Cloudflare challenge; a
        # plain fetch was verified blocked at both. A store that still blocks
        # keeps its old price and gets an honest "unreachable" status - the
        # script never invents a number (see scripts/third_stores.py).
        run: '"%PYTHON%" scripts/third_stores.py'
        continue-on-error: true

      - name: Commit third-store prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "chore: refresh third-store prices"
          git pull --no-rebase -X ours origin main
          git push
        continue-on-error: true

      - name: End the pipeline progress bar
        if: always()
        # The archived sweep is the LAST phase, so clear any progress
        # unconditionally - including the handoff hold the main run left up.
        run: |
          "%PYTHON%" -c "import json; p='docs/data/latest.json'; d=json.load(open(p)); sp=d.pop('scrape_progress',None); sp is not None and open(p,'w').write(json.dumps(d,separators=(',',':')))"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "chore: scrape pipeline finished"
          git pull --no-rebase -X ours origin main
          git push
        continue-on-error: true
