<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basket — PriceWatch</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --ww: #00843D; --coles: #CC0000; --bg: #F0F4F8; --card: #fff;
      --border: #E2E8F0; --text: #1A1F2E; --text-mid: #475569; --text-soft: #94A3B8;
      --green: #059669; --green-light: #ECFDF5; --radius: 10px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

    header { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
    .header-inner { max-width: 1600px; margin: 0 auto; padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .header-left { display: flex; align-items: center; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 7px; text-decoration: none; }
    .brand-name { font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; }
    .store-chip-hdr { display: inline-flex; align-items: center; justify-content: center; font-weight: 900; border-radius: 7px; color: #fff; width: 26px; height: 26px; font-size: 13px; }
    .store-chip-hdr.ww { background: var(--ww); }
    .store-chip-hdr.coles { background: var(--coles); }
    nav { display: flex; gap: 4px; }
    nav a { font-size: 13px; font-weight: 500; color: var(--text-mid); padding: 6px 12px; border-radius: 8px; text-decoration: none; transition: background 0.15s, color 0.15s; }
    nav a:hover { background: var(--bg); color: var(--text); }
    nav a.active { background: var(--bg); color: var(--text); font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .btn-hdr { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: var(--ww); color: #fff; box-shadow: 0 1px 3px rgba(0,132,61,0.35); transition: all 0.15s; }
    .btn-hdr:hover { background: #006B31; transform: translateY(-1px); }

    main { max-width: 860px; margin: 0 auto; padding: 24px; }

    /* ── Store card summary ─────────────────── */
    .store-summary-wrap {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      margin-bottom: 24px; overflow: hidden;
    }
    .store-cards-grid { display: grid; grid-template-columns: 1fr 1fr; }
    .store-card-sl {
      display: grid;
      grid-template-rows: auto auto auto auto 1fr auto minmax(36px,auto);
      padding: 20px 24px; border-bottom: 3px solid transparent;
      background: var(--card); cursor: pointer;
      transition: background .15s, border-bottom-color .15s;
    }
    .store-card-sl + .store-card-sl { border-left: 1px solid var(--border); }
    .store-card-sl.card-active   { background: #F0FDF4; border-bottom-color: #00843D; }
    .store-card-sl.card-inactive:hover { background: #FFF8F8; }
    .sc-icon { margin-bottom: 12px; }
    .sc-icon-chip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 10px;
      font-weight: 900; color: #fff; font-size: 18px; line-height: 1;
    }
    .sc-icon-chip.ww    { background: var(--ww); }
    .sc-icon-chip.coles { background: var(--coles); }
    .sc-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .sc-store-name { font-size: 14px; font-weight: 700; }
    .sc-item-pill {
      font-size: 11px; background: var(--bg); color: var(--text-soft);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 1px 8px; font-weight: 500;
    }
    .sc-price { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-bottom: 6px; }
    .sc-price.price-active   { color: var(--green); }
    .sc-price.price-inactive { color: var(--text-soft); }
    .sc-subtitle { font-size: 12px; color: var(--text-soft); }
    .sc-spacer { min-height: 8px; }
    .sc-badge-row { margin-top: 12px; }
    .sc-badge {
      display: inline-block; background: var(--green); color: #fff;
      font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 10px;
    }
    .sc-hint { font-size: 11px; color: var(--text-soft); font-style: italic; min-height: 36px; padding-top: 4px; }
    /* ── Save ribbon (replaces stats bar) ── */
    .bar-ribbon {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: #fff; border-top: 1px solid var(--border);
      padding: 10px 20px;
    }
    .bar-save-chip {
      display: inline-flex; align-items: center; gap: 7px;
      background: #ECFDF5; border: 1px solid #D1FAE5;
      color: #059669; font-size: 13px; font-weight: 700;
      padding: 6px 14px; border-radius: 20px; white-space: nowrap;
    }
    .bar-save-chip-eq {
      background: #F1F5F9; border-color: var(--border); color: #64748B;
    }
    .ribbon-sep {
      width: 1px; height: 18px; background: var(--border);
      margin: 0 2px; flex-shrink: 0;
    }
    .bar-store-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #F1F5F9; color: #475569;
      font-size: 12px; font-weight: 600;
      padding: 5px 11px; border-radius: 14px; white-space: nowrap;
    }
    .bar-store-chip.ww-chip::before {
      content: ''; display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--ww); flex-shrink: 0;
    }
    .bar-store-chip.co-chip::before {
      content: ''; display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--coles); flex-shrink: 0;
    }
    .bar-store-chip.eq-chip::before {
      content: ''; display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      background: #94A3B8; flex-shrink: 0;
    }

    /* Store sections */
    .store-section { margin-bottom: 28px; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 0 10px;
      border-bottom: 2px solid var(--border); margin-bottom: 0;
    }
    .store-chip { display: inline-flex; align-items: center; justify-content: center; font-weight: 900; border-radius: 7px; color: #fff; width: 28px; height: 28px; font-size: 14px; }
    .store-chip.ww { background: var(--ww); }
    .store-chip.coles { background: var(--coles); }
    .section-title { font-size: 16px; font-weight: 700; }
    .section-count { font-size: 12px; color: var(--text-soft); }

    table { width: 100%; border-collapse: collapse; table-layout: fixed; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
    thead th { background: var(--bg); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-soft); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    thead th.r { text-align: right; }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:nth-child(even) { background: #FAFBFC; }
    td { padding: 10px 14px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.r { text-align: right; font-weight: 600; }
    .item-name-cell { font-weight: 500; white-space: normal; }
    .item-cat { font-size: 11px; color: var(--text-soft); margin-top: 1px; }
    .price-val { font-size: 15px; font-weight: 700; }
    .unit-val { font-size: 11px; color: var(--text-soft); }
    .total-val { font-size: 15px; font-weight: 700; color: var(--text); }
    tfoot td { background: var(--bg); font-weight: 700; font-size: 15px; border-top: 2px solid var(--border); padding: 11px 14px; }
    tfoot td.r { text-align: right; }

    /* Only-one-store note */
    .only-note { font-size: 12px; color: var(--text-soft); font-style: italic; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-top: 8px; }

    /* Print button */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text-mid); transition: all .15s; }
    .btn:hover { background: var(--bg); color: var(--text); }
    .btn-primary { background: var(--ww); color: #fff; border-color: var(--ww); }
    .btn-primary:hover { background: #006B31; }

    .sl-topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .filter-note { font-size: 12px; color: var(--text-soft); background: #FFFBEB; border: 1px solid #FCD34D; border-radius: var(--radius); padding: 8px 14px; margin-bottom: 0; flex: 1; min-width: 0; }
    .btn-outline-danger { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid #FCA5A5; background: transparent; color: #DC2626; transition: all .15s; white-space: nowrap; }
    .btn-outline-danger:hover { background: #FEF2F2; border-color: #DC2626; }

    .empty { text-align: center; padding: 60px 20px; color: var(--text-soft); }
    .empty a { color: var(--ww); text-decoration: underline; }

    @media (max-width: 700px) {
      .header-inner { padding: 0 10px; gap: 8px; }
      .brand-name { display: none; }
      nav { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      nav::-webkit-scrollbar { display: none; }
      nav a { white-space: nowrap; font-size: 13px; padding: 6px 8px; }
      .btn-hdr { display: none; }
      .store-cards-grid { grid-template-columns: 1fr; }
      .store-card-sl + .store-card-sl { border-left: none; border-top: 1px solid var(--border); }
      .bar-ribbon { gap: 8px; padding: 10px 14px; }
      .sc-price { font-size: 26px; }
    }
    @media print {
      header .header-actions { display: none; }
      body { background: #fff; }
      main { padding: 12px; }
      .totals-bar, table { box-shadow: none; }
    }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="header-left">
      <a href="index.html" class="brand">
        <span class="store-chip-hdr ww">W</span>
        <span class="store-chip-hdr coles">C</span>
        <span class="brand-name">PriceWatch</span>
      </a>
      <nav>
        <a href="hot-deals.html">🔥 Hot Deals</a>
        <a href="validate.html" id="validateNavLink" style="display:none">⚠️ Validate</a>
        <a href="shopping-list.html" class="active">🛒 Basket</a>
      </nav>
    </div>
    <div class="header-right">
      <button class="btn btn-ghost btn-icon" id="notifBtn" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="notif-badge" id="notifBadge"></span>
      </button>
      <button class="btn-hdr" onclick="window.print()">🖨 Print</button>
    </div>
  </div>
</header>

<div class="notif-dropdown" id="notifDropdown" style="display:none">
  <div class="notif-header">
    <strong>Item name changes detected</strong>
    <button class="notif-dismiss-all" id="notifDismissAll">Dismiss all</button>
  </div>
  <div class="notif-items" id="notifItems"></div>
</div>

<main id="main">
  <div class="empty">Loading…</div>
</main>

<script>
const fmt = n => n != null ? `$${Number(n).toFixed(2)}` : '—';

function getCategory(item, catOv) { return catOv[item.list_item] || item.category || 'Other'; }

function getUnits(itemName, unitOv, analysis) {
  const ov = unitOv[itemName];
  if (ov != null) return ov;
  const qty = analysis[itemName]?.avg_qty;
  return qty != null ? Math.round(qty) : 1;
}

function fmtUnit(price, unit) {
  if (price == null) return '';
  if (!unit) return '';
  const m = unit.match(/^\d*\.?\d*\s*(?:g|kg|ml|l|ea|pk|pack|each)\b/i);
  return m ? `/${m[0].trim()}` : '';
}

async function boot() {
  const main = document.getElementById('main');

  // Load data
  let data, analysis = {}, catOv = {}, unitOv = {};
  try {
    const res = await fetch(`data/latest.json?t=${Date.now()}`);
    data = await res.json();
  } catch {
    main.innerHTML = '<div class="empty">Could not load price data.</div>';
    return;
  }
  try { analysis = await fetch('data/item_analysis.json').then(r => r.json()); } catch {}
  try { catOv  = JSON.parse(localStorage.getItem('pw_categories_v1') || '{}'); } catch {}
  try { unitOv = JSON.parse(localStorage.getItem('pw_units_v1') || '{}'); } catch {}
  try {
    const prioOv = JSON.parse(localStorage.getItem('pw_priorities_v1') || '{}');
    Object.assign(analysis, Object.fromEntries(Object.entries(prioOv).map(([k, v]) => [k, { ...(analysis[k] || {}), priority: v }])));
  } catch {}

  // Read handoff written by app.js exportShoppingList()
  let handoff = null;
  try {
    const raw = localStorage.getItem('pw_sl_handoff');
    handoff = raw ? JSON.parse(raw) : null;
    localStorage.removeItem('pw_sl_handoff');
  } catch {}
  console.log('[PW] pw_sl_handoff on load:', handoff ? { count: handoff.items?.length, first3: handoff.items?.slice(0, 3), note: handoff.note } : null);

  const allItems = (data.items || []).filter(i => !i.archived);

  let displayItems;
  if (handoff && Array.isArray(handoff.items) && handoff.items.length > 0) {
    const nameSet = new Set(handoff.items);
    displayItems = allItems.filter(i => nameSet.has(i.list_item));
    console.log('[PW] displayItems after handoff filter:', displayItems.length);
  } else {
    displayItems = allItems; // fallback: show everything
    console.log('[PW] No handoff — showing all', displayItems.length, 'items');
  }

  if (!displayItems.length) {
    main.innerHTML = '<div class="empty">No items found for this selection.</div>';
    return;
  }

  // Banner note
  const filterNote = handoff?.note ? `Showing ${handoff.note}` : `Showing all items (${displayItems.length})`;

  // Equal-price items (same price at both stores) — reassignable by user
  const equalItems = displayItems.filter(i =>
    i.cheaper_store === 'equal' &&
    i.woolworths?.price != null &&
    i.coles?.price != null);

  let equalStore = 'ww'; // which store equal-price items are currently assigned to

  // Store-agnostic aggregate totals (what it costs to buy everything at one store)
  const wwTotal = displayItems
    .filter(i => i.woolworths?.price != null)
    .reduce((s, i) => s + i.woolworths.price * getUnits(i.list_item, unitOv, analysis), 0);
  const coTotal = displayItems
    .filter(i => i.coles?.price != null)
    .reduce((s, i) => s + i.coles.price * getUnits(i.list_item, unitOv, analysis), 0);
  const wwCount = displayItems.filter(i => i.woolworths?.price != null).length;
  const coCount = displayItems.filter(i => i.coles?.price != null).length;
  const saving  = Math.abs(wwTotal - coTotal);
  const isEqual = saving < 0.01; // FIX 3: detect equal totals
  const wwWins  = !isEqual && wwTotal < coTotal;
  const coWins  = !isEqual && coTotal < wwTotal;

  function computeSplit() {
    // FIX 1: equal-price items go to the store selected by equalStore
    const wwItems = displayItems.filter(i =>
      i.woolworths?.price != null &&
      (i.cheaper_store === 'woolworths' ||
       (i.cheaper_store === 'equal' && equalStore === 'ww') ||
       i.coles?.price == null));
    const colesItems = displayItems.filter(i =>
      i.coles?.price != null &&
      (i.cheaper_store === 'coles' ||
       (i.cheaper_store === 'equal' && equalStore === 'coles') ||
       i.woolworths?.price == null));   // Coles-only items always go here
    return { wwItems, colesItems };
  }

  function buildTable(storeItems, store) {
    if (!storeItems.length) return `<p class="only-note">No items are cheapest at ${store === 'ww' ? 'Woolworths' : 'Coles'} in this selection.</p>`;
    const subtotal = storeItems.reduce((s, i) => {
      const price = store === 'ww' ? i.woolworths?.price : i.coles?.price;
      return s + (price ?? 0) * getUnits(i.list_item, unitOv, analysis);
    }, 0);
    const rows = storeItems.map(i => {
      const sd = store === 'ww' ? i.woolworths : i.coles;
      const units = getUnits(i.list_item, unitOv, analysis);
      const lineTotal = (sd?.price ?? 0) * units;
      const cat = getCategory(i, catOv);
      const unitStr = fmtUnit(sd?.unit_price, sd?.unit);
      return `<tr>
        <td class="item-name-cell">
          ${i.list_item}
          ${cat ? `<div class="item-cat">${cat}</div>` : ''}
        </td>
        <td class="r"><span class="price-val">${fmt(sd?.price)}</span>${unitStr ? `<div class="unit-val">${unitStr}</div>` : ''}</td>
        <td class="r">${units}</td>
        <td class="r"><span class="total-val">${fmt(lineTotal)}</span></td>
      </tr>`;
    }).join('');
    return `<table>
      <colgroup>
        <col style="width:auto">
        <col style="width:110px">
        <col style="width:80px">
        <col style="width:90px">
      </colgroup>
      <thead><tr><th>Item</th><th class="r">Price</th><th class="r">Qty</th><th class="r">Total</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td><strong>Subtotal</strong></td><td></td><td></td><td class="r"><strong>${fmt(subtotal)}</strong></td></tr></tfoot>
    </table>`;
  }

  // renderContent() is called on boot and again whenever equalStore changes
  function renderContent() {
    const { wwItems, colesItems } = computeSplit();
    const ec = equalItems.length;
    const wwActive = equalStore === 'ww';

    // Card classes
    const wwCardCls = `store-card-sl ${wwActive ? 'card-active' : 'card-inactive'}`;
    const coCardCls = `store-card-sl ${!wwActive ? 'card-active' : 'card-inactive'}`;

    // Price colour — active card always green, inactive always grey
    const wwPriceCls = wwActive ? 'price-active' : 'price-inactive';
    const coPriceCls = !wwActive ? 'price-active' : 'price-inactive';

    // Badge visibility — hidden when totals are equal OR card is not active
    const wwBadgeStyle = (isEqual || !wwActive) ? 'visibility:hidden' : '';
    const coBadgeStyle = (isEqual || wwActive)  ? 'visibility:hidden' : '';

    // Hint text (only if equal-price items exist)
    const wwHint = ec > 0
      ? (wwActive
          ? `Includes ${ec} equal-price item${ec !== 1 ? 's' : ''} assigned here · Click Coles → to switch`
          : `← Click to move equal-price items here`)
      : '';
    const coHint = ec > 0
      ? (!wwActive
          ? `Includes ${ec} equal-price item${ec !== 1 ? 's' : ''} assigned here · Click WW → to switch`
          : `Click to move equal-price items here →`)
      : '';

    // ── Save ribbon ──────────────────────────────────────────────────────────
    // Intrinsic classification counts (independent of equalStore assignment)
    const wwOnlyCount = displayItems.filter(i => i.cheaper_store === 'woolworths').length;
    const coOnlyCount = displayItems.filter(i => i.cheaper_store === 'coles').length;
    const ribbonSaveChip = isEqual
      ? `<span class="bar-save-chip bar-save-chip-eq">⚖ Same price at both stores</span>`
      : `<span class="bar-save-chip">
           <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
           You save ${fmt(saving)}
         </span>`;
    const ribbonChips = [
      wwOnlyCount > 0    ? `<span class="bar-store-chip ww-chip">${wwOnlyCount} at Woolworths</span>` : '',
      equalItems.length > 0 ? `<span class="bar-store-chip eq-chip">${equalItems.length} equal-price</span>` : '',
      coOnlyCount > 0    ? `<span class="bar-store-chip co-chip">${coOnlyCount} at Coles</span>` : '',
    ].join('');

    main.innerHTML = `
      <div class="sl-topbar">
        <div class="filter-note">📋 ${filterNote}</div>
        <button id="removeAllBtn" class="btn-outline-danger">🗑 Remove All</button>
      </div>

      <div class="store-summary-wrap">
        <div class="store-cards-grid">
          <div class="${wwCardCls}" id="wwTotalBlock">
            <div class="sc-icon"><span class="sc-icon-chip ww">W</span></div>
            <div class="sc-name-row">
              <span class="sc-store-name">Woolworths</span>
              <span class="sc-item-pill">${wwCount} item${wwCount !== 1 ? 's' : ''}</span>
            </div>
            <div class="sc-price ${wwPriceCls}">${fmt(wwTotal)}</div>
            <div class="sc-subtitle">If you bought everything here</div>
            <div class="sc-spacer"></div>
            <div class="sc-badge-row">
              <span class="sc-badge" style="${wwBadgeStyle}">✓ Selected store</span>
            </div>
            <div class="sc-hint">${wwHint}</div>
          </div>
          <div class="${coCardCls}" id="colesTotalBlock">
            <div class="sc-icon"><span class="sc-icon-chip coles">C</span></div>
            <div class="sc-name-row">
              <span class="sc-store-name">Coles</span>
              <span class="sc-item-pill">${coCount} item${coCount !== 1 ? 's' : ''}</span>
            </div>
            <div class="sc-price ${coPriceCls}">${fmt(coTotal)}</div>
            <div class="sc-subtitle">If you bought everything here</div>
            <div class="sc-spacer"></div>
            <div class="sc-badge-row">
              <span class="sc-badge" style="${coBadgeStyle}">✓ Selected store</span>
            </div>
            <div class="sc-hint">${coHint}</div>
          </div>
        </div>
        <div class="bar-ribbon">
          ${ribbonSaveChip}
          <div class="ribbon-sep"></div>
          ${ribbonChips}
        </div>
      </div>

      <div class="store-section">
        <div class="section-header">
          <span class="store-chip ww">W</span>
          <span class="section-title">Buy at Woolworths</span>
          <span class="section-count">${wwItems.length} item${wwItems.length !== 1 ? 's' : ''}</span>
        </div>
        ${buildTable(wwItems, 'ww')}
      </div>

      <div class="store-section">
        <div class="section-header">
          <span class="store-chip coles">C</span>
          <span class="section-title">Buy at Coles</span>
          <span class="section-count">${colesItems.length} item${colesItems.length !== 1 ? 's' : ''}</span>
        </div>
        ${buildTable(colesItems, 'coles')}
      </div>
    `;

    // Wire store-block click handlers to reassign equal-price items
    if (ec > 0) {
      document.getElementById('wwTotalBlock')?.addEventListener('click', () => {
        if (equalStore !== 'ww') { equalStore = 'ww'; renderContent(); }
      });
      document.getElementById('colesTotalBlock')?.addEventListener('click', () => {
        if (equalStore !== 'coles') { equalStore = 'coles'; renderContent(); }
      });
    }

    document.getElementById('removeAllBtn')?.addEventListener('click', () => {
      if (confirm('Remove all items from your basket?')) {
        localStorage.removeItem('pw_sl_handoff');
        main.innerHTML = '<div class="empty">Your basket is empty. <a href="index.html">Go back to add items.</a></div>';
      }
    });
  }

  renderContent();
}

boot();

// ── Bell notifications + validate link ───────────────────────────────────────
(async function initNavBell() {
  // Show/hide validate nav link based on pending_validation count
  const validateLink = document.getElementById('validateNavLink');
  if (validateLink) {
    try {
      const r = await fetch(`data/latest.json?t=${Date.now()}`);
      if (r.ok) {
        const data = await r.json();
        const count = (data.pending_validation || []).length;
        validateLink.style.display = count > 0 ? '' : 'none';
        if (count > 0) validateLink.textContent = `⚠️ Validate (${count})`;
      }
    } catch {}
  }
  // Bell: show if there are undismissed name changes
  try {
    const r = await fetch(`data/name_changes_detected.json?t=${Date.now()}`);
    if (!r.ok) return;
    const changes = await r.json();
    const keys = Object.keys(changes || {}).sort();
    if (!keys.length) return;
    const fingerprint = keys.join('|');
    if (localStorage.getItem('pw_notif_dismissed_v1') === fingerprint) return;
    const notifBtn = document.getElementById('notifBtn');
    const notifBadge = document.getElementById('notifBadge');
    const notifItems = document.getElementById('notifItems');
    const notifDropdown = document.getElementById('notifDropdown');
    if (!notifBtn) return;
    notifBadge.textContent = keys.length;
    notifBtn.style.display = 'inline-flex';
    notifItems.innerHTML = keys.map(k => `<span class="notif-item">${k}</span>`).join('');
    notifBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      notifDropdown.style.display = notifDropdown.style.display === 'none' ? 'block' : 'none';
    });
    document.addEventListener('click', () => { notifDropdown.style.display = 'none'; });
    document.getElementById('notifDismissAll')?.addEventListener('click', () => {
      localStorage.setItem('pw_notif_dismissed_v1', fingerprint);
      notifBtn.style.display = 'none';
      notifDropdown.style.display = 'none';
    });
  } catch {}
})();
</script>
