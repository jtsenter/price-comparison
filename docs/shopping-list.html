<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Basket - PriceWatch</title>
  <meta name="description" content="Your PriceWatch basket - split across Woolworths and Coles for the cheapest total." />
  <meta name="theme-color" content="#00843D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PriceWatch" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script>
  (function () {
    try {
      var t = localStorage.getItem('pw_theme') || 'light';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
  </script>
  <style>
    :root {
      --ww: #00843D; --coles: #CC0000; --bg: #F0F4F8; --card: #fff;
      --border: #E2E8F0; --text: #1A1F2E; --text-mid: #475569; --text-soft: #94A3B8;
      --green: #059669; --green-light: #ECFDF5; --radius: 10px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

    header { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
    .header-inner { max-width: 1600px; margin: 0 auto; padding: 0 20px; height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .header-left { display: flex; align-items: center; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 7px; text-decoration: none; }
    .brand-name { font-size: 17px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; display: none; /* wordmark retired - W/C chips are the home link */ }
    .store-chip-hdr { display: inline-flex; align-items: center; justify-content: center; font-weight: 900; border-radius: 7px; color: #fff; width: 26px; height: 26px; font-size: 13px; }
    .store-chip-hdr.ww { background: var(--ww); }
    .store-chip-hdr.coles { background: var(--coles); }
    nav { display: flex; gap: 4px; }
    nav a { font-size: 13px; font-weight: 500; color: var(--text-mid); padding: 6px 12px; border-radius: 8px; text-decoration: none; transition: background 0.15s, color 0.15s; }
    nav a:hover { background: var(--bg); color: var(--text); }
    nav a.active { background: var(--bg); color: var(--text); font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 8px; }

    /* 1100px: the old 860px left dead margins while the tables squeezed -
       give the name column the room instead. */
    main { max-width: 1100px; margin: 0 auto; padding: 24px; }

    /* ── Store card summary ─────────────────── */
    /* Three panels on one row: WW card | savings panel | Coles card - all three
       trip prices (each store + the split price) sit side by side. */
    .store-summary-wrap { margin-bottom: 20px; }
    .store-cards-grid { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 10px; align-items: stretch; }
    .store-card-sl {
      display: grid;
      grid-template-columns: auto 1fr auto;
      grid-template-areas: "icon name price" "icon name foreign" "icon name badge";
      column-gap: 12px; row-gap: 2px;
      align-items: center; align-content: center;
      padding: 12px 16px;
      background: var(--card); cursor: pointer;
      border: 2px solid var(--border); border-radius: 12px;
      transition: background .15s, border-color .15s;
    }
    /* Active card carries its store identity, not a fixed green */
    .store-card-sl.ww.card-active    { background: #F0FDF4; border-color: var(--ww); }
    .store-card-sl.coles.card-active { background: #FEF5F5; border-color: var(--coles); }
    .store-card-sl.card-inactive:hover { background: var(--bg); }
    /* Split mode: two real subtotals, neither store is "selected" - not
       clickable, so no pointer cursor and no hover affordance. */
    .store-card-sl.card-neutral { cursor: default; }
    .sc-icon { grid-area: icon; }
    .sc-icon-chip {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 10px;
      font-weight: 900; color: #fff; font-size: 18px; line-height: 1;
    }
    .sc-icon-chip.ww    { background: var(--ww); }
    .sc-icon-chip.coles { background: var(--coles); }
    .sc-name-row { grid-area: name; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
    .sc-store-name { font-size: 14px; font-weight: 700; }
    .sc-item-pill {
      font-size: 11px; background: var(--bg); color: var(--text-soft);
      border: 1px solid var(--border); border-radius: 10px;
      padding: 1px 8px; font-weight: 500;
    }
    .sc-price { grid-area: price; justify-self: end; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .sc-price.price-active   { color: var(--green); }
    .sc-price.price-inactive { color: var(--text-soft); }
    .sc-badge-row { grid-area: badge; justify-self: end; min-height: 18px; display: flex; align-items: center; gap: 6px; }
    /* "incl. N from C/W" on its own line under the price so it never crowds the
       badge - the card grows taller to fit it (empty row = 0 height otherwise). */
    .sc-foreign-row { grid-area: foreign; justify-self: end; }
    .sc-foreign { display: inline-block; font-size: 10px; color: var(--text-soft); white-space: nowrap; cursor: help; background: var(--bg); border-radius: 8px; padding: 1px 7px; }
    .sc-badge {
      display: inline-block; background: var(--green); color: #fff;
      font-size: 11px; font-weight: 700; padding: 2px 10px; border-radius: 10px;
    }
    .sc-delta { font-size: 11px; font-weight: 600; color: var(--text-soft); font-variant-numeric: tabular-nums; }
    /* Savings panel - one line per figure (label left, price right), chips below */
    .sl-savings-panel {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px;
    }
    .sl-savings-panel .saving-info { display: flex; flex-direction: column; gap: 0; }
    /* All three lines share the same side padding so the Split shop line's
       label and amount COLUMN-ALIGN with Basket/Split saving (its tint box
       used to inset them by its own padding). 9px + 1px border = 10px. */
    .sl-savings-panel .saving-line { padding: 4px 10px; }
    .sl-savings-panel .saving-line + .saving-line { border-top: 1px solid var(--border); }
    .sl-savings-panel .saving-text { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .sl-savings-panel .saving-label { margin-bottom: 0; }
    .sl-savings-panel .saving-amount { font-size: 16px; }
    /* Shared saving figures (see basketSavingLine / splitSavingLine): bold-green
       total (split only) + green (−$X) bracket.
       Two FIXED grid tracks, not a right-aligned flex row. As flex, the Basket
       line (bracket only) and the Split line (total + bracket) right-aligned as
       whole blocks, so the two brackets landed on different x - 740 vs 732 -
       and the panel read as ragged. The total column now holds its width even
       on the row that has no total, so the brackets line up down the panel. */
    .saving-figs {
      display: grid; grid-template-columns: auto minmax(0, auto);
      align-items: baseline; justify-content: end; gap: 8px;
    }
    .saving-figs .sv-disc { grid-column: 2; }
    .sv-total { font-size: 18px; font-weight: 800; color: var(--green); line-height: 1; font-variant-numeric: tabular-nums; }
    .sv-disc  { font-size: 14px; font-weight: 700; color: var(--green); font-variant-numeric: tabular-nums; }
    .sl-savings-panel .saving-icon { width: 22px; font-size: 16px; }
    .sl-savings-panel .saving-icon .store-chip { width: 22px; height: 22px; font-size: 12px; }
    .sl-savings-panel .bar-ribbon-chips { justify-content: center; gap: 6px; border-top: 1px solid var(--border); padding-top: 6px; margin-top: 2px; flex-wrap: nowrap; }
    /* The middle hero panel is too narrow (~380px) to fit all three chips WITH
       their words on one line. The W/C/= icon + count already says it, so drop
       the redundant words here (as mobile does) and keep them in the tooltip. */
    .sl-savings-panel .bar-ribbon-chips .chip-word { display: none; }
    /* Split mode: a connected X + Y = Z bar directly beneath the two store
       cards, spanning the grid - the equation ties the card totals to the
       combined trip price. */
    .trip-bar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; background: #F0FDF4; border: 1px solid #D1FAE5; border-radius: 10px; padding: 7px 12px; }
    .trip-bar .tb-label { font-size: 10px; font-weight: 700; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.06em; }
    .trip-bar strong { font-size: 22px; font-weight: 800; color: var(--green); font-variant-numeric: tabular-nums; }
    .sl-mode-btn:disabled { opacity: .45; cursor: default; }
    /* ── Save ribbon (replaces stats bar) ── */
    .bar-ribbon {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: #fff; border-top: 1px solid var(--border);
      padding: 10px 20px;
    }
    .bar-save-chip {
      display: inline-flex; align-items: center; gap: 7px;
      background: #ECFDF5; border: 1px solid #D1FAE5;
      color: #059669; font-size: 13px; font-weight: 700;
      padding: 6px 14px; border-radius: 20px; white-space: nowrap;
    }
    .bar-save-chip-eq {
      background: #F1F5F9; border-color: var(--border); color: #64748B;
    }
    .bar-save-chip-warn {
      background: #FFF7ED; border-color: #FED7AA; color: #C2410C;
    }
    .ribbon-sep {
      width: 1px; height: 18px; background: var(--border);
      margin: 0 2px; flex-shrink: 0;
    }
    .bar-store-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #F1F5F9; color: #475569;
      font-size: 12px; font-weight: 600;
      padding: 5px 11px; border-radius: 14px; white-space: nowrap;
    }
    /* WW/Coles chips carry the real store logo square; only equal-price keeps a dot */
    .bar-store-chip .store-chip { width: 18px; height: 18px; font-size: 10px; border-radius: 5px; flex-shrink: 0; }
    /* Equal-price chip: a gray "=" square matching the W/C store chips - the
       old bare 8px gray dot read as nothing in particular on mobile. */
    .bar-store-chip.eq-chip::before {
      content: '='; display: inline-flex; align-items: center; justify-content: center;
      width: 18px; height: 18px; border-radius: 5px;
      background: #94A3B8; color: #fff; font-size: 12px; font-weight: 800;
      line-height: 1; flex-shrink: 0;
    }
    /* ── Optimal split strip ── */
    .bar-optimal {
      background: #F0FDF4; border-top: 1px solid #D1FAE5;
      border-bottom: 1px solid #D1FAE5;
      padding: 9px 22px; font-size: 13px; color: #059669;
      display: flex; align-items: center; gap: 8px;
    }
    .bar-optimal strong { font-size: 15px; font-weight: 800; }
    .bar-optimal span { color: #94A3B8; font-size: 12px; }
    /* Saving lines - same "Basket saving / Split shop" component as the main page. */
    .saving-line { display: flex; align-items: center; gap: 10px; }
    .saving-icon { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 26px; font-size: 20px; }
    .split-icon { display: block; border-radius: 50%; }
    .saving-text { text-align: left; line-height: 1; }
    /* Flex so the ? info icon centres on the text line instead of hanging low */
    .saving-label { display: flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.06em; }
    .saving-amount { font-size: 20px; font-weight: 800; color: var(--green); line-height: 1; }
    .bar-ribbon-chips { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Store sections */
    .store-section { margin-bottom: 28px; }
    .section-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 0 10px;
      border-bottom: 2px solid var(--border); margin-bottom: 0;
    }
    .store-chip { display: inline-flex; align-items: center; justify-content: center; font-weight: 900; border-radius: 7px; color: #fff; width: 28px; height: 28px; font-size: 14px; }
    .store-chip.ww { background: var(--ww); }
    .store-chip.coles { background: var(--coles); }
    .section-title { font-size: 16px; font-weight: 700; }
    .section-count { font-size: 12px; color: var(--text-soft); }

    .sl-table-wrap { clip-path: inset(0 round var(--radius)); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; background: var(--card); }
    thead th { position: sticky; top: var(--header-h, 60px); z-index: 10; background: var(--bg); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-soft); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); box-shadow: 0 1px 0 var(--border); }
    thead th:last-child { border-right: none; }
    thead th.r { text-align: right; }
    .sl-sort-hdr { cursor: pointer; user-select: none; }
    .sl-sort-hdr:hover { color: var(--text); }
    tbody tr { border-bottom: 1px solid var(--border); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:nth-child(even) { background: #FAFBFC; }
    td { padding: 10px 14px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.r { text-align: right; font-weight: 600; }
    /* Name cell is the ONLY one that gives way: single line, ellipsis when
       long (full name in the title tooltip). Everything else keeps its room. */
    .item-name-cell { font-weight: 500; max-width: 0; }
    .name-wrap { display: flex; align-items: center; gap: 9px; line-height: 1.35; min-width: 0; }
    .name-wrap span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sl-thumb { width: 30px; height: 30px; border-radius: 6px; object-fit: contain; background: #fff; border: 1px solid var(--border); flex-shrink: 0; }
    /* Single-store mode: item not sold at the chosen store - priced from the other */
    /* Row for an item this store doesn't sell (one-store mode borrows the other
       store's price so the trip total stays honest): grayed with a quiet dash. */
    .row-fellback td { opacity: .55; }
    .row-fellback .act-cell { opacity: 1; } /* keep ✕ fully usable */
    .from-other { color: var(--text-soft); font-weight: 700; margin-left: 5px; cursor: help; }
    /* Category entry subline: the actual product this store's price is for */
    .bg-pick { font-size: 11px; color: var(--text-soft); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bg-qty { color: var(--text-mid); font-weight: 600; }
    .price-val { font-size: 15px; font-weight: 700; }
    /* "/kg" after a category row's rate - same treatment as the main table */
    .pv-suffix { font-size: 10px; font-weight: 600; color: var(--text-soft, #94A3B8); margin-left: 1px; }
    .unit-val { font-size: 11px; color: var(--text-soft); }
    .total-val { font-size: 15px; font-weight: 700; color: var(--text); }
    /* Multi-buy tag icon beside a line total (hover for the full deal). Inline
       so it never adds a second row. `saved` = the deal is already in this
       total (green); `hint` = one more unit would reach it (muted). */
    .mb-ico { display: inline-flex; vertical-align: middle; margin-left: 4px; line-height: 0; cursor: help; }
    .mb-ico svg { display: block; }
    .mb-ico.saved { color: var(--ww, #00843D); }
    .mb-ico.hint  { color: var(--text-soft, #94A3B8); }
    /* Other store's promo marker inside the muted alt price ("C $3.50 2/$6") */
    .alt-mb { font-size: 10px; font-weight: 700; color: var(--text-soft, #94A3B8); border: 1px solid var(--border); border-radius: 7px; padding: 0 4px; }
    /* Pricing-basis note - rides on the end of the item-count line (only when
       the basket holds per-kg category rows) rather than taking its own row.
       Inherits the count line's size so the two read as one sentence; a spaced
       pipe separates them (they were running together at the same weight). */
    .sl-rate-note {
      color: var(--text-soft); font-size: inherit; white-space: nowrap;
      margin-left: 10px; padding-left: 12px; border-left: 1px solid var(--border);
    }
    .sl-rate-note .info-ico { vertical-align: middle; margin-left: 3px; }
    .sl-rate-note .info-ico:hover::after, .sl-rate-note .info-ico:focus::after {
      width: 320px; top: calc(100% + 7px); bottom: auto;   /* too tall to open upward */
    }
    /* Narrow screens: a 320px bubble centred on a 13px icon starts off-screen
       (measured -171px at 375px wide), so pin it to the viewport instead.
       Duplicated from style.css because this page does not load it. */
    @media (max-width: 700px) {
      .sl-rate-note .info-ico:hover::after, .sl-rate-note .info-ico:focus::after {
        position: fixed;
        left: 12px; right: 12px; width: auto; max-width: none;
        top: auto; bottom: auto; transform: none;
      }
    }
    @media (max-width: 700px) { .sl-rate-note { display: none; } }
    /* Money and quantities align digit-for-digit down a column */
    .price-val, .total-val, .unit-val, .qs-val, .sc-price, .saving-amount, tfoot td { font-variant-numeric: tabular-nums; }
    tfoot td { background: var(--bg); font-weight: 700; font-size: 15px; border-top: 2px solid var(--border); padding: 11px 14px; }
    tfoot td.r { text-align: right; }

    /* ── Inline row controls: qty stepper + swap-store + remove ── */
    .qty-step { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card); }
    .qs-btn { width: 26px; height: 26px; border: none; background: transparent; color: var(--text-mid); font-size: 15px; font-weight: 600; cursor: pointer; line-height: 1; -webkit-tap-highlight-color: transparent; }
    .qs-btn:hover { background: var(--bg); color: var(--text); }
    .qs-val { min-width: 24px; text-align: center; font-weight: 600; font-size: 13px; }
    /* ⇄ / ✕ as proper mini-buttons - same border/radius family as the qty
       stepper so they read as part of the table, not floating glyphs. */
    .act-wrap { display: flex; gap: 5px; justify-content: flex-end; align-items: center; }
    .row-btn {
      width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid var(--border); background: var(--card); border-radius: 8px;
      cursor: pointer; font-size: 13px; color: var(--text-mid); line-height: 1; padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .row-btn:hover { background: var(--bg); color: var(--text); }
    .row-btn:disabled { opacity: .35; cursor: default; pointer-events: none; }
    .row-btn.rm:hover { color: #DC2626; border-color: #FCA5A5; background: rgba(220,38,38,.08); }
    /* Buttons/steppers, not text: the default td ellipsis clipped them to a dead "…" */
    .act-cell, .qty-cell { text-align: right; overflow: visible; text-overflow: clip; }

    /* Column resize handles (initSlResize creates them; without these rules
       they were 0-width and invisible - columns LOOKED unresizable) */
    .col-resize-handle {
      position: absolute; right: -4px; top: 10%; bottom: 10%;
      width: 9px; cursor: col-resize; border-radius: 3px;
      background: transparent; transition: background 0.15s; z-index: 2;
    }
    .col-resize-handle::before {
      content: ''; position: absolute; left: 3px; top: 0; bottom: 0; width: 3px;
      border-radius: 3px; background: rgba(0,0,0,0.12);
    }
    .col-resize-handle:hover::before, .col-resize-handle.resizing::before { background: var(--ww); }

    /* Info "?" bubbles (same component as the main page) */
    .info-ico {
      display: inline-flex; align-items: center; justify-content: center;
      width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0;
      border: 1px solid var(--border); color: var(--text-soft);
      font-size: 9px; font-weight: 800; line-height: 1;
      letter-spacing: 0; text-transform: none;
      cursor: help; position: relative;
    }
    .info-ico:hover, .info-ico:focus { color: var(--text); outline: none; }
    .info-ico:hover::after, .info-ico:focus::after {
      content: attr(data-tip);
      position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%);
      background: var(--text); color: var(--card);
      font-size: 11px; font-weight: 500; line-height: 1.45; text-transform: none; letter-spacing: 0;
      padding: 7px 11px; border-radius: 7px; width: 230px; text-align: left;
      white-space: normal; z-index: 600; pointer-events: none;
      box-shadow: 0 4px 14px rgba(0,0,0,.2);
    }

    /* Shopping mode is phone-only (in-store tool) - hide its toggle on web */
    @media (min-width: 701px) { .sl-mode-seg.sl-shop-seg { display: none; } }

    /* Only-one-store note */
    .only-note { font-size: 12px; color: var(--text-soft); font-style: italic; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-top: 8px; }

    /* Print button */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--card); color: var(--text-mid); transition: all .15s; }
    .btn:hover { background: var(--bg); color: var(--text); }
    .btn-primary { background: var(--ww); color: #fff; border-color: var(--ww); box-shadow: 0 1px 3px rgba(0,132,61,0.35); }
    .btn-primary:hover { background: #006B31; transform: translateY(-1px); }

    .sl-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
    /* Quiet one-liner ("N hot deals" / "N items") - sits inline in the topbar,
       on the same line as the One store / Split shop toggle. */
    .sl-note { font-size: 13px; color: var(--text-soft); }
    .sl-note strong { color: var(--text-mid); }
    .btn-outline-danger { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid #FCA5A5; background: transparent; color: #DC2626; transition: all .15s; white-space: nowrap; }
    .btn-outline-danger:hover { background: #FEF2F2; border-color: #DC2626; }

    .empty { text-align: center; padding: 60px 20px; color: var(--text-soft); }
    .empty a { color: var(--ww); text-decoration: underline; }

    /* Header icon nav (mirrors style.css's .nav-icon-btn - this page has its own CSS) */
    .btn-ghost { background: var(--card); color: var(--text-mid); }
    .btn-ghost:hover { background: var(--bg); color: var(--text); }
    .btn-icon { position: relative; padding: 6px 8px; }
    .header-div { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; margin: 0 2px; }
    .nav-icon-btn { text-decoration: none; padding: 6px 8px; }
    .nav-icon-btn svg { display: block; }
    .nav-icon-btn.nav-hot    { color: #DC2626; }
    .nav-icon-btn.nav-basket { color: var(--ww); }
    .nav-icon-btn.nav-watch  { color: #D97706; }
    .nav-icon-btn.nav-hot:hover    { color: #B91C1C; background: rgba(220,38,38,.08); }
    .nav-icon-btn.nav-basket:hover { color: #006B31; background: rgba(0,132,61,.08); }
    .nav-icon-btn.nav-watch:hover  { color: #B45309; background: rgba(217,119,6,.08); }
    .nav-icon-btn.here.nav-basket  { background: rgba(0,132,61,.10); border-color: rgba(0,132,61,.35); }
    /* Mirrors style.css's mobile header: nav cluster + bell hidden, but keep the
       Watchlist shortcut (its only mobile entry point) AND ⚙ Options - Options
       carries theme, scrape log and "fix stuck data", which a phone needs too. */
    @media (max-width: 700px) {
      .nav-icon-btn, .header-div { display: none; }
      #notifBtn { display: none !important; }
      .header-right .nav-icon-btn.nav-watch { display: inline-flex; }
    }

    /* ── Shopping mode - big tap-to-check rows for in-store use ── */
    /* Both top toggles (One store/Split shop and List/Shopping mode) share the
       SAME border + button sizing so the two rectangles are equal height. */
    .sl-mode-seg { display: inline-flex; border: 2px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    /* Other store's price rides along muted next to each row price */
    .alt-price { font-size: 11px; color: var(--text-soft); font-weight: 600; margin-left: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .sl-mode-btn {
      padding: 10px 18px; font-size: 14px; font-weight: 700; border: none; cursor: pointer;
      background: var(--card); color: var(--text-mid);
      display: inline-flex; align-items: center; gap: 6px; -webkit-tap-highlight-color: transparent;
    }
    .sl-mode-btn + .sl-mode-btn { border-left: 1px solid var(--border); }
    .sl-mode-btn.active { background: var(--ww); color: #fff; }
    .sm-progress-card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 14px 18px; margin-bottom: 18px;
      position: sticky; top: calc(var(--header-h, 60px) + 8px); z-index: 20;
    }
    .sm-progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
    .sm-count { font-size: 13px; color: var(--text-mid); }
    .sm-total-wrap { font-size: 13px; color: var(--text-mid); }
    .sm-total { font-size: 18px; font-weight: 800; color: var(--text); }
    .sm-bar-track { height: 6px; background: var(--bg); border-radius: 999px; overflow: hidden; }
    .sm-bar-fill { height: 100%; width: 0; background: var(--ww); border-radius: 999px; transition: width .2s; }
    /* Per-store counts in the sticky card: instant visible feedback when the
       One store ⇄ Split shop toggle changes the plan (the store sections
       themselves are below the fold, so without this a tap looked like a no-op). */
    .sm-store-chips { display: flex; gap: 6px; justify-content: center; margin-top: 9px; }
    .sm-chip { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 10px; color: #fff; }
    .sm-chip.smw { background: var(--ww); }
    .sm-chip.smc { background: var(--coles); }
    .sm-store-h { display: flex; align-items: center; gap: 10px; padding: 18px 0 8px; }
    .sm-cat { font-size: 11px; font-weight: 700; color: var(--text-soft); text-transform: uppercase; letter-spacing: .05em; padding: 10px 4px 5px; }
    .sm-row {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 13px 14px; cursor: pointer; margin-bottom: 6px;
      -webkit-tap-highlight-color: transparent; font: inherit; color: inherit;
    }
    .sm-row:active { background: var(--bg); }
    .sm-check {
      width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border);
      flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 15px; line-height: 1;
    }
    .sm-row.done .sm-check { background: var(--ww); border-color: var(--ww); }
    /* Product shot - the whole point of shopping mode is recognising the pack on
       a shelf, which a name alone doesn't do for own-brand items. Fixed 40px box
       so a missing or broken image leaves a tidy placeholder instead of shunting
       the row's whole layout sideways (onerror drops the <img>, the box stays).
       White plate in BOTH themes: store shots are cut out on white, and letting
       them sit on the dark card just draws a white rectangle anyway. */
    .sm-thumb {
      width: 40px; height: 40px; flex-shrink: 0; overflow: hidden;
      border-radius: 7px; border: 1px solid var(--border); background: #fff;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .sm-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
    /* contain, not cover: a cropped pack shot is worse than a small one. */
    .sm-name {
      flex: 1; min-width: 0; font-size: 14px; font-weight: 500; color: var(--text);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; line-height: 1.3;
    }
    .sm-qty { font-size: 12px; color: var(--text-soft); white-space: nowrap; }
    .sm-sub { font-size: 11px; color: var(--text-soft); font-weight: 600; }
    .sm-price { font-size: 14px; font-weight: 700; min-width: 52px; text-align: right; color: var(--text); }
    .sm-row.done { opacity: .55; }
    .sm-row.done .sm-name, .sm-row.done .sm-price { text-decoration: line-through; color: var(--text-soft); }
    :root[data-theme="dark"] .sl-mode-btn { background: var(--card); color: var(--text-mid); }
    :root[data-theme="dark"] .sl-mode-btn.active { background: var(--ww); color: #fff; }

    @media (max-width: 700px) {
      /* Home (bottom tab bar already has it), the W/C logo, and Print (no phone
         has a printer) leave the header with nothing left to show - the bottom
         tab bar covers navigation. Drop the whole row; the scrape-progress strip
         (a sibling, not inside .header-inner) still shows when relevant. */
      .header-inner { display: none; }
      nav { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      nav::-webkit-scrollbar { display: none; }
      nav a { white-space: nowrap; font-size: 13px; padding: 6px 8px; }
      /* Compact W-vs-C cards side by side, savings panel full-width below them
         (desktop puts the panel BETWEEN the cards; the shared DOM reorders here
         via grid `order`). Cards stack their content vertically on a phone. */
      .store-cards-grid { grid-template-columns: 1fr 1fr; }
      .sl-savings-panel { order: 3; grid-column: 1 / -1; }
      /* The store badge is back on phones. It was hidden because the desktop
         card puts icon / name / price on ONE row, which cannot fit in the ~168px
         each card gets when the two sit side by side. Re-laid out instead of
         re-hidden: badge and store name share the top row, the price takes the
         full width beneath it. The badge is the fastest way to tell the two
         cards apart at a glance - it carries the store's colour, so you read
         green-or-red before you read any word. Same card in both one-store and
         split mode, so both get it. */
      .store-card-sl {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        grid-template-areas: "icon name" "price price" "foreign foreign" "badge badge";
        column-gap: 8px; row-gap: 3px; align-content: start;
        padding: 12px 14px;
      }
      .sc-icon { display: block; align-self: center; }
      .sc-icon-chip { width: 26px; height: 26px; font-size: 13px; border-radius: 7px; }
      .sc-name-row { align-self: center; margin-bottom: 2px; }
      .sc-price { justify-self: start; }
      .sc-badge-row, .sc-foreign-row { justify-self: start; margin-top: 4px; }
      .bar-ribbon { gap: 8px; padding: 10px 14px; }
      .sc-price { font-size: 24px; margin-bottom: 2px; }
      main { padding-left: 12px; padding-right: 12px; }
      /* Topbar: fixed-size controls - each segment/button gets exactly half the
         row instead of letter-count width, so the stack aligns edge to edge. */
      .sl-topbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .sl-flexspacer { display: none; }
      .sl-mode-seg { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; }
      .sl-mode-btn { justify-content: center; }
      .sl-split-seg .sl-mode-btn { padding: 10px 8px; }
      /* Note + its action button share ONE row in every mobile view (list AND
         shopping mode): note on the left, button on the right. Previously the
         list-mode Remove All button sat alone in the left half with dead space
         beside it, while shopping mode's Reset spanned the full width - so the
         two modes looked different. */
      .sl-note { grid-column: 1; align-self: center; text-align: left; font-size: 12px; }
      #removeAllBtn, #smResetBtn { grid-column: 2; justify-content: center; }
      /* The thumbnail costs 40px of a 375px screen, so the row buys it back from
         its own padding and gaps rather than from the product name - at 12px gaps
         the name dropped to ~139px and clipped mid-word on ordinary items. The
         thumbnail also makes the row taller than the 26px tick did, which is the
         headroom the 2-line name clamp uses. */
      .sm-row { gap: 9px; padding: 10px 11px; }
      .sm-price { min-width: 48px; }
      /* One-line savings + tinted Split shop row come from the shared
         .sl-savings-panel base styles; mobile only shortens the chip wording */
      .chip-word { display: none; }
      /* Stacked rows replace the table grid: a 6-column table can't fit a 375px
         phone, so each row becomes a two-line card - name (+ remove) on top,
         price · qty stepper · line total underneath. Same markup, CSS-only. */
      .sl-table-wrap table, .sl-table-wrap tbody, .sl-table-wrap tfoot { display: block; }
      .sl-table-wrap colgroup, .sl-table-wrap thead { display: none; }
      .sl-table-wrap tbody tr {
        display: grid;
        grid-template-columns: 1fr auto auto;
        grid-template-areas: "name name act" "price qty total";
        gap: 6px 12px; padding: 10px 12px; align-items: center;
      }
      .sl-table-wrap td { padding: 0; border: none; white-space: normal; overflow: visible; text-overflow: clip; }
      .item-name-cell { grid-area: name; max-width: none; }
      .cat-cell { display: none; }
      .price-cell { grid-area: price; text-align: left; }
      .qty-cell { grid-area: qty; }
      .total-cell { grid-area: total; text-align: right; min-width: 64px; }
      .act-cell { grid-area: act; align-self: start; }
      /* Finger-sized touch targets */
      .qs-btn { width: 34px; height: 34px; }
      .row-btn { padding: 8px 9px; font-size: 14px; }
      .sl-table-wrap tfoot tr { display: flex; justify-content: space-between; padding: 11px 12px; background: var(--bg); border-top: 2px solid var(--border); }
      .sl-table-wrap tfoot td { padding: 0; border: none; background: none; }
      .sl-table-wrap tfoot td:empty { display: none; }
    }
    @media print {
      header .header-actions { display: none; }
      body { background: #fff; }
      main { padding: 12px; }
      table { box-shadow: none; }
      /* Paper is read-only: keep the qty NUMBER, drop the buttons */
      .qs-btn, .act-cell, .sl-topbar, .sl-note { display: none; }
      .qty-step { border: none; }
    }

    /* Bottom tab bar */
    #bottomTabBar { display: none; }
    @media (max-width: 700px) {
      #bottomTabBar {
        display: flex; position: fixed; bottom: 0; left: 0; right: 0; height: 56px;
        background: var(--card); border-top: 1px solid var(--border);
        box-shadow: 0 -2px 8px rgba(0,0,0,.08); z-index: 150;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .btb-tab {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 2px; text-decoration: none; color: var(--text-soft);
        font-size: 10px; font-weight: 600; letter-spacing: .03em;
        padding: 5px 0; -webkit-tap-highlight-color: transparent;
        transition: color 0.12s;
      }
      .btb-tab.active { color: var(--ww); }
      .btb-tab svg { flex-shrink: 0; }
      /* header nav only - a bare `nav` also matched #bottomTabBar and hid it */
      header nav { display: none !important; }
      main { padding-bottom: 80px !important; }
    }

    /* Dark mode */
    :root[data-theme="dark"] {
      --bg: #0f172a; --card: #1e293b; --border: #334155;
      --text: #f1f5f9; --text-mid: #94a3b8; --text-soft: #64748b;

      & body { background: var(--bg); color: var(--text); }
      & header { background: var(--card); border-bottom-color: var(--border); }
      & .store-card-sl { background: var(--card); }
      & .store-card-sl.ww.card-active    { background: #052e16; border-color: var(--ww); }
      & .store-card-sl.coles.card-active { background: #450a0a; border-color: var(--coles); }
      & .bar-ribbon { background: var(--card); border-top-color: var(--border); }
      & .bar-optimal { background: #052e16; border-color: #14532d; }
      & .trip-bar { background: #052e16; border-color: #14532d; }
      & tbody tr:nth-child(even) { background: #182030; }
      & tfoot td { background: var(--bg); }
      & table { background: var(--card); }
      & .only-note { background: var(--card); border-color: var(--border); }
      & #bottomTabBar { background: var(--card); border-top-color: var(--border); }
    }

    /* ── "Worth the detour?" prompt (basket, one-store mode) ──────────────────
       A speech bubble, because it is the app saying something rather than another
       panel of data. The rows are a GRID, not flex: with flex, every product name
       was a different length so the store chips and prices landed in a different
       place on each line and the block read as noise. Four fixed columns line the
       chips, the arrows, the prices and the savings all up. */
    /* Full width. The 720px cap was meant to stop a wide bubble sprawling, but
       on a 1450px screen it left the thing sitting under two thirds of the page
       with a large empty gap beside it, which read as broken rather than
       restrained. The row grid already keeps the content aligned at any width. */
    .detour {
      position: relative; margin: 22px 0 10px; padding: 15px 17px 14px;
      border: 1.5px solid #C7D2FE; border-radius: 16px;
      background: linear-gradient(180deg, #EEF2FF, var(--card));
      box-shadow: 0 2px 10px rgba(67,56,202,.07);
    }
    /* The bubble's tail, drawn as two stacked triangles so the 1.5px border reads
       round the point too. */
    .detour::before, .detour::after {
      content: ''; position: absolute; top: -11px; left: 30px;
      border-left: 11px solid transparent; border-right: 11px solid transparent;
      border-bottom: 11px solid #C7D2FE;
    }
    .detour::after { top: -9px; border-bottom-color: #EEF2FF; }
    .dt-h { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 14.5px; color: #3730A3; }
    /* The title shrinks before the pill or the ✕ do - those two are fixed-size
       facts, the sentence is the part that can afford an ellipsis. */
    .dt-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dt-pct {
      margin-left: auto; flex-shrink: 0;
      font-size: 11.5px; font-weight: 700; color: #4338CA;
      background: #E0E7FF; padding: 3px 10px; border-radius: 9px; white-space: nowrap;
    }
    .dt-sub { font-size: 12.5px; color: var(--text-mid); margin: 5px 0 12px; }
    /* name | from | arrow | to | saving - fixed tracks, so every row aligns. */
    .dt-row {
      display: grid; grid-template-columns: minmax(0, 1fr) 92px 16px 92px 84px;
      align-items: center; gap: 8px; padding: 9px 12px; margin-bottom: 7px;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    }
    .dt-name { min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* The chip track was 18px while the chip itself renders at 28px, so every
       chip spilled 10px into the price column and sat under the digits - the
       overlap was on both the live price and the struck-through one. The track
       is the chip's real width now, and the chip is pinned to it so it cannot
       grow past its column again. */
    .dt-p {
      display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; gap: 7px;
      font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
    }
    .dt-p .store-chip { width: 22px; height: 22px; font-size: 12px; border-radius: 6px; flex-shrink: 0; }
    .dt-from { color: var(--text-soft); }
    .dt-from .dt-amt { text-decoration: line-through; }
    .dt-to { color: var(--text); }
    .dt-arrow { color: var(--text-soft); font-size: 13px; text-align: center; }
    .dt-save { text-align: right; font-size: 13px; font-weight: 800; color: var(--ww); font-variant-numeric: tabular-nums; }
    .dt-foot { display: flex; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .dt-total { font-size: 13.5px; font-weight: 800; margin-right: auto; }
    .dt-total b { color: var(--ww); }
    .dt-verdict {
      font-size: 12px; color: #7C2D12; background: #FFF7ED;
      border-left: 3px solid #c95000; padding: 9px 12px; border-radius: 0 8px 8px 0; margin-top: 12px;
    }
    /* In the header row, not absolutely positioned over it. Floating at
       `right: 12px` it sat ON TOP of the right edge of the "% of your split
       saving" pill - the ✕ spanned x 802-813 while the pill ended at 808. As a
       flex item it cannot collide with anything, whatever the pill's text says.
       24px so it is a real hit target; it was 11x17. */
    .dt-x {
      flex-shrink: 0; width: 24px; height: 24px; display: flex;
      align-items: center; justify-content: center;
      border: 0; background: none; cursor: pointer; color: var(--text-soft);
      font-size: 13px; border-radius: 6px; padding: 0;
    }
    .dt-x:hover { color: var(--text); background: rgba(0,0,0,.05); }
    .dt-x:focus-visible { outline: 2px solid #4338CA; outline-offset: 1px; }
    /* The "it's off" line. Quiet enough to ignore, present enough to undo. */
    .detour-off {
      margin: 18px 0 6px; font-size: 12.5px; color: var(--text-soft);
      display: flex; align-items: center; gap: 8px;
    }
    .detour-off button {
      font: inherit; font-weight: 700; color: #4338CA; background: none;
      border: 0; padding: 0; cursor: pointer; text-decoration: underline;
    }
    .detour-off button:hover { color: #3730A3; }
    @media (max-width: 700px) {
      .detour { margin-top: 18px; }
      .dt-row { grid-template-columns: 1fr auto; row-gap: 6px; }
      .dt-name { grid-column: 1 / -1; white-space: normal; }
      .dt-arrow { display: none; }
      .dt-save { grid-column: 2; }
      /* At 375px all four header items on one line squeezed the title to 94px -
         "3 items much cheaper at Woolworths" became three words. The pill is
         the least important of the four, so it takes its own line and the
         sentence gets the first one in full. */
      .dt-h { flex-wrap: wrap; row-gap: 6px; align-items: flex-start; }
      /* `1 1 0`, not `1 1 auto`: at auto the title claims its full natural
         width and pushes the ✕ onto a line of its own. At 0 it shares the line
         and wraps to two lines inside its own column instead. */
      .dt-title { white-space: normal; flex: 1 1 0; min-width: 0; }
      .dt-x { order: 3; }
      .dt-pct { order: 4; flex-basis: 100%; margin-left: 0; }
      .dt-foot .btn { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
<header data-page="shopping-list"></header>
<script src="header.js?v=27"></script>

<main id="main">
  <div class="empty">Loading…</div>
</main>

<script src="name_map.js?v=55"></script>
<script src="utils.js?v=145"></script>
<script>
// fmt() lives in utils.js (loaded above).
// Short display name (same map the rest of the site uses); falls back to the
// raw name minus the "Woolworths " prefix when an item isn't in the map.
// Category entries render their group label, never the raw __group_* key.
const dispName = i => i._isGroup ? i._groupLabel : shortName(i.list_item);
// PACK SIZE of a unit-based per-kg group's pick at `store` ("1kg", "2kg") -
// rendered beside the pick name. The pack MULTIPLIER is not shown here: it
// lives in the row's qty cell (2 units of 1kg vs 1 unit of 2kg).
const pickQty = (i, store) => {
  const best = store === 'ww' ? i._wwBest : i._coBest;
  // Pack size in kg = pack price ÷ its $/kg.
  const size = (best?.result?.price != null && best?.perkg) ? best.result.price / best.perkg : null;
  if (size == null) return '';
  // Snap to 0.05kg: size is derived as price ÷ $/kg and $/kg is rounded to 4dp,
  // so a clean 4kg bag can read as 3.99. Grocery pack sizes are 0.05kg-grained.
  return `${Math.round(size * 20) / 20}kg`;
};

// ── Basket column widths ──────────────────────────────────────────────────────
let _slColWidths = (() => {
  try { return JSON.parse(localStorage.getItem('pw_sl_col_widths')) || {}; } catch { return {}; }
})();
function saveSlColWidths() { localStorage.setItem('pw_sl_col_widths', JSON.stringify(_slColWidths)); }

function initSlResize() {
  // table-layout:fixed sizes every column from the <colgroup>'s <col> widths -
  // the old code resized the th/td elements, which fixed layout IGNORES, so
  // dragging "didn't act accordingly". Resize the <col> itself.
  document.querySelectorAll('.sl-table-wrap table').forEach(table => {
    const cols = table.querySelectorAll('colgroup col');
    table.querySelectorAll('thead th').forEach((th, colIdx) => {
      const key = th.dataset.col;
      const colEl = cols[colIdx];
      if (!key || !colEl) return;
      if (_slColWidths[key]) colEl.style.width = _slColWidths[key] + 'px';
      if (th.querySelector('.col-resize-handle')) return;
      const handle = document.createElement('div');
      handle.className = 'col-resize-handle';
      th.appendChild(handle);
      handle.addEventListener('mousedown', (e) => {
        e.preventDefault(); e.stopPropagation();
        const startX = e.clientX;
        const startW = th.getBoundingClientRect().width;
        handle.classList.add('resizing');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        function onMove(ev) {
          colEl.style.width = Math.max(50, startW + ev.clientX - startX) + 'px';
        }
        function onUp() {
          handle.classList.remove('resizing');
          document.body.style.cursor = ''; document.body.style.userSelect = '';
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          _slColWidths[key] = Math.round(th.getBoundingClientRect().width);
          saveSlColWidths();
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  });
}

// normalizeCategory (utils.js) keeps old override/scraper names pointing at live categories.
// A member takes its category's category - same rule as the main page's
// getCategory(), so the basket groups a product under the same heading the
// table shows it under. variantGroupOf/GROUP_DEFAULT_CATEGORY are in utils.js.
function getCategory(item, catOv) {
  const g = variantGroupOf(item.list_item);
  if (g) return normalizeCategory(g.category || GROUP_DEFAULT_CATEGORY);
  return normalizeCategory(catOv[item.list_item] || ITEM_CATEGORY_DEFAULTS[item.list_item] || item.category);
}

// ── Dynamic sticky header offset ─────────────────────────────────────────────
// Calculates actual nav height and applies it to thead th sticky offset.
// This prevents floating prices if header height ever changes.
function fixStickyOffset() {
  const navH = document.querySelector('header')?.offsetHeight || 60;
  document.querySelectorAll('thead th').forEach(th => {
    th.style.top = navH + 'px';
  });
}
window.addEventListener('load', fixStickyOffset);
window.addEventListener('resize', fixStickyOffset);

async function boot() {
  const main = document.getElementById('main');

  // Load data
  let data, analysis = {}, catOv = {};
  try {
    const res = await fetch(`data/latest.json?t=${Date.now()}`);
    data = await res.json();
  } catch {
    main.innerHTML = '<div class="empty">Could not load price data.</div>';
    return;
  }
  try { analysis = await fetch('data/item_analysis.json').then(r => r.json()); } catch {}
  try { catOv  = JSON.parse(localStorage.getItem('pw_categories_v1') || '{}'); } catch {}
  try {
    const prioOv = JSON.parse(localStorage.getItem('pw_priorities_v1') || '{}');
    Object.assign(analysis, Object.fromEntries(Object.entries(prioOv).map(([k, v]) => [k, { ...(analysis[k] || {}), priority: v }])));
  } catch {}

  // The basket: a normal persistent cart (localStorage pw_sl_handoff, written
  // by the main page's add/remove controls and by removals here). Nothing lands
  // in it unless the user explicitly added it, and it stays until removed.
  // (The old consume-once handoff + lock flag are retired - drop the flag.)
  let handoff = null;
  try { handoff = JSON.parse(localStorage.getItem('pw_sl_handoff') || 'null'); } catch {}
  localStorage.removeItem('pw_sl_locked');

  // Match against ALL items, not just active ones: a per-kg group's cheapest
  // variant can be an archived product the user deliberately added.
  const basketNames = new Set(handoff?.items || []);
  let displayItems = (data.items || []).filter(i => basketNames.has(i.list_item));

  // Per-kg CATEGORY entries (__group_* keys): the basket follows the group,
  // not a frozen product pick. Each store's side is re-resolved HERE, on every
  // visit, to that store's cheapest variant by $/kg (cheapest sticker when no
  // size resolves) - so a category is never "one store only" as long as either
  // store prices any variant, and price changes move the pick automatically.
  {
    const byName = new Map((data.items || []).map(i => [i.list_item, i]));
    // ONE builder, shared with the main table (utils.js). This page used to have
    // its own copy that disagreed on member lists, $/kg exclusions and the
    // comparison metric, so a category could total differently on the two pages.
    const wanted = new Set([...basketNames].filter(n => n.startsWith('__group_')));
    for (const g of buildVariantGroups(byName)) {
      if (!wanted.has(g.list_item)) continue;
      if (g._wwPerKg == null && g._coPerKg == null) continue; // nothing priced yet
      // How many whole packs of the picked product make up the planned quantity -
      // shown next to the pick so you know what to actually put in the trolley.
      // It does NOT drive the money: see groupStoreTotal().
      const packsFor = (best) => {
        if (!best?.result || best.result.price == null || !best.perkg) return null;
        const packKg = best.result.price / best.perkg;         // pack size in kg
        return packKg > 0 ? Math.max(1, Math.ceil(groupUnits(g.list_item) / packKg)) : null;
      };
      displayItems.push({
        ...g,
        _wwPickName: g._wwBest ? g._wwBest.name : null,
        _coPickName: g._coBest ? g._coBest.name : null,
        _wwPacks: packsFor(g._wwBest),
        _coPacks: packsFor(g._coBest),
      });
    }
  }

  // Basket quantities: how many UNITS OF EACH PRODUCT are in the cart (integer
  // packs, default 1, min 1) - deliberately independent of the main page's
  // Units column, which plans kg amounts. bq() also sanitises legacy values
  // (old snapshots held kg fractions like 0.2, which made steppers nonsense).
  let basketQty = (handoff?.quantities && typeof handoff.quantities === 'object') ? { ...handoff.quantities } : {};
  const bq = n => { const q = Number(basketQty[n]); return Number.isFinite(q) && q >= 1 ? Math.round(q) : 1; };

  // An empty basket renders the NORMAL screen - hero panels, toggle, empty
  // tables - not a bare "go back" message.

  // "N items in your basket" caption - rendered in BOTH list and shopping mode,
  // positioned UNDER the mode toggles. A function, not a boot-time const: row
  // removals re-render and the count must track the live basket.
  const filterNoteHtml = () =>
    `<strong>${displayItems.length}</strong> item${displayItems.length !== 1 ? 's' : ''} in your basket`;

  // Split mode: which table a truly equal-priced item is LISTED under (the two
  // tables can't overlap). It costs the same either way, so this is a fixed
  // tie-breaker, not a user choice - see the store-card click removal below.
  const equalStore = 'ww';

  // View model: ONE store by default - the realistic plan is buying the whole
  // basket at whichever store totals cheaper. "Split shop" opts into the
  // two-table cheapest-at-each-store view. Persisted across visits.
  // Always opens in one-store - the realistic default plan. Split shop is a
  // per-visit opt-in (deliberately NOT persisted; it kept surprising on return).
  let slSplit = false;
  let chosenStore = null; // single mode: store to buy at; null = auto (cheaper total)

  // Per-row "buy it at the other store instead" overrides (split mode only,
  // session-only). Clicking a store card resets them.
  const storeOverride = new Map(); // list_item → 'ww' | 'coles'

  // Pack multiplier for a store's side of a row: per-kg category rows scale the
  // smaller pack up to the group's comparison weight (2 × 1kg vs 1 × 2kg);
  // everything else is 1.
  const packsOf = (i, store) => (store === 'ww' ? i._wwPacks : i._coPacks) ?? 1;
  // The price this row SHOWS at `store` - the SAME number the main table shows:
  // $/kg for a weighed category, pack price for everything else. Null when the
  // store doesn't price it.
  const effPrice = (i, store) => {
    if (i._isGroup) return store === 'ww' ? i._wwPerKg : i._coPerKg;
    // shelfPrice: same reason as lineCost below - `price` is a per-kg rate for a
    // by-weight row, and this is the figure printed beside it.
    return shelfPrice(store === 'ww' ? i.woolworths : i.coles);
  };
  // Effective price of an item at `store`. In SINGLE mode, items the store
  // doesn't sell fall back to the other store's price (you have no choice for
  // those) - the same rule computeTotals uses, so the table subtotal always
  // EQUALS the store card total. In split mode no fallback (an item is only
  // in a store's table because it's priced there).
  function priceFor(i, store) {
    const own = effPrice(i, store);
    if (own != null || slSplit) return own;
    return effPrice(i, store === 'ww' ? 'coles' : 'ww');
  }

  // ── Multi-buy ("2 for $7") ────────────────────────────────────────────────
  // The PER-UNIT price on screen never changes - only what the line actually
  // costs. Units at the register = basket qty × packs (a per-kg row can be
  // several packs), so the promo is counted against real packs, not rows.
  const mbOf = (i, store) => ((store === 'ww' ? i.woolworths : i.coles) || {}).multi_buy || null;
  const unitsOf = (i, store) => bq(i.list_item);
  // What this row costs at `store` = the price shown x the quantity shown - the
  // SAME rule (and for categories the SAME function) as the main table's Total
  // column, which is why the two pages' store totals agree to the cent.
  function lineCost(i, store) {
    if (i._isGroup) return groupStoreTotal(i, store);            // utils.js
    // shelfPrice (utils.js), not .price: a WW by-weight row stores a per-KG RATE
    // there, so a loose-mushroom line billed at $13.90 instead of the $2.78 the
    // portion actually costs. Mirrors mbLineCost() on the main page - these two
    // must agree to the cent or the basket total contradicts the table's.
    const p = shelfPrice(store === 'ww' ? i.woolworths : i.coles);
    if (p == null) return null;
    return multiBuyCost(unitsOf(i, store), p, mbOf(i, store));   // utils.js
  }
  // Line cost with the same single-mode fallback priceFor uses, so a table
  // subtotal always equals its store-card total.
  function lineCostFor(i, store) {
    const own = lineCost(i, store);
    if (own != null || slSplit) return own;
    return lineCost(i, store === 'ww' ? 'coles' : 'ww');
  }
  // What this line saves right now because of a multi-buy (0 when none applies).
  function lineMbSaving(i, store) {
    const mb = mbOf(i, store);
    const p = store === 'ww' ? i.woolworths?.price : i.coles?.price;
    if (!mb || p == null) return 0;
    const u = unitsOf(i, store);
    return +(u * p - multiBuyCost(u, p, mb)).toFixed(2);
  }
  // Which store is cheaper for this row RIGHT NOW - multi-buy AND qty aware
  // (lineCost, not effPrice), so a "2 for $4" that only beats the other store
  // at 2+ units flips the answer as the shopper steps the qty up (the avocado
  // case: WW cheaper at 1, Coles cheaper at 2). Matches computeSplit's sticker()
  // routing, so the ribbon counts and the split plan can never disagree.
  function cheaperStoreNow(i) {
    const w = lineCost(i, 'ww'), c = lineCost(i, 'coles');
    if (w == null || c == null) return null;   // single-store item - no contest
    if (w < c - 0.005) return 'ww';
    if (c < w - 0.005) return 'coles';
    return 'equal';
  }
  // Multi-buy marker for a line total: a small tag icon, not a second text row
  // (the old "deal −$X" wrapped and grew every promo row). The full wording -
  // deal terms and the exact saving - lives in the hover title.
  const mbTag = (cls, title) => `<span class="mb-ico ${cls}" title="${escAttr(title)}"><svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58s1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41s-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg></span>`;

  // Per-table sort state - survives renderContent() re-renders
  let wwSortKey = 'category', wwSortDir = 'asc';
  let colesSortKey = 'category', colesSortDir = 'asc';

  // Rewrite the stored basket to match what's on screen, so removals here
  // persist (and the main page's ✓ marks stay in sync on the next visit).
  function persistBasket() {
    localStorage.setItem('pw_sl_handoff', JSON.stringify({
      items: displayItems.map(i => i.list_item),
      quantities: basketQty,
    }));
    window.pwSyncBasketBadge?.();   // header.js - basket count on the 🛒 nav icon
  }

  function sortItems(items, store, key, dir) {
    const mul = dir === 'asc' ? 1 : -1;
    return [...items].sort((a, b) => {
      let av, bv;
      if (key === 'category') {
        av = getCategory(a, catOv).toLowerCase();
        bv = getCategory(b, catOv).toLowerCase();
      } else if (key === 'item') {
        av = dispName(a).toLowerCase();
        bv = dispName(b).toLowerCase();
      } else if (key === 'price') {
        av = priceFor(a, store) ?? Infinity;
        bv = priceFor(b, store) ?? Infinity;
      } else if (key === 'total') {
        av = lineCostFor(a, store) ?? 0;   // multi-buy aware, matches the cell
        bv = lineCostFor(b, store) ?? 0;
      }
      return typeof av === 'string' ? av.localeCompare(bv) * mul : (av - bv) * mul;
    });
  }

  // Store-agnostic aggregate totals: the true cost of getting the WHOLE basket
  // primarily from one store, buying single-store-only items from wherever they
  // ARE priced (you have no choice for those). Previously each total summed ONLY
  // items priced at that store and silently dropped the rest - understating cost
  // rather than admitting "you can't get this here" - which let "Best split" (a
  // true full-basket total) come out MORE expensive than either "single store"
  // total, an impossible result for a real shopping trip. Every total must cover
  // the same item set for the comparison to mean anything.
  // Computed per render (not once at boot): qty steppers and row removals
  // change them live.
  function computeTotals() {
    // Multi-buy aware (lineCost), so "which store is cheaper" is decided on what
    // you'd actually be charged - a store can win on promos despite a dearer
    // shelf price. Same fallback rule as before: an item the store doesn't sell
    // is counted at the other store's price, so both totals cover the same set.
    const wwTotal = displayItems.reduce((s, i) => {
      const c = lineCost(i, 'ww') ?? lineCost(i, 'coles');
      return c != null ? s + c : s;
    }, 0);
    const coTotal = displayItems.reduce((s, i) => {
      const c = lineCost(i, 'coles') ?? lineCost(i, 'ww');
      return c != null ? s + c : s;
    }, 0);
    // diff drives the ribbon chip state (cheaper / paying-more / equal).
    const diff = Math.abs(wwTotal - coTotal);
    return { wwTotal, coTotal, diff, isEqual: diff < 0.01 };
  }

  // The split PLAN: what Split shop mode actually does right now (computeSplit
  // routing, incl. any row swaps). EVERY split figure derives from this one
  // plan - an abstract "each item at its cheapest sticker" total could
  // disagree with the plan's own routing (which is $/kg-based for per-kg
  // categories) and advertise a saving no real trip would collect, e.g. a
  // "Split saving" while the plan put every single item in one store.
  function computePlan() {
    const { wwItems, colesItems } = computeSplit();
    const sub = (items, store) => items.reduce((s, i) => s + (lineCostFor(i, store) ?? 0), 0);
    return {
      wwItems, colesItems,
      total: sub(wwItems, 'ww') + sub(colesItems, 'coles'),
      splits: wwItems.length > 0 && colesItems.length > 0,
    };
  }

  function computeSplit() {
    // Routing rules - every displayItem ends up in exactly one table:
    //   an explicit per-row override wins; otherwise route to the store with the
    //   cheaper STICKER price (what you actually pay for this row), equal-price
    //   items follow equalStore, single-store items go where they exist.
    // NOT cheaper_store: that flag can be $/kg-based and, for a size-mismatched
    // pair (e.g. a quarter cabbage $2.10 vs a whole one $6.90), name the pricier
    // sticker store - which sent the "split" plan to a dearer total and hid the
    // Split saving even though a real split saves money.
    // lineCost, not effPrice: routing must compare what you'd actually PAY for
    // this row - packs-scaled AND multi-buy aware. effPrice was qty-blind, so a
    // row whose promo only kicks in at 2 units never flipped store when the
    // shopper stepped the qty up, and the split plan disagreed with the
    // (multi-buy aware) totals - which is how a real $3 split saving could
    // vanish: the plan routed by shelf price to a dearer total. Un-swapped rows
    // now re-route automatically as qty changes; a manual ⇄ still wins.
    const sticker = i => {
      const w = lineCost(i, 'ww'), c = lineCost(i, 'coles');
      if (w == null) return 'coles';
      if (c == null) return 'ww';
      if (w < c - 0.005) return 'ww';
      if (c < w - 0.005) return 'coles';
      return 'equal';
    };
    const wwItems = displayItems.filter(i => {
      if (i.woolworths?.price == null) return false;
      const ov = storeOverride.get(i.list_item);
      if (ov) return ov === 'ww';
      const s = sticker(i);
      return s === 'ww' || (s === 'equal' && equalStore === 'ww');
    });
    const colesItems = displayItems.filter(i => {
      if (i.coles?.price == null) return false;
      const ov = storeOverride.get(i.list_item);
      if (ov) return ov === 'coles';
      const s = sticker(i);
      return s === 'coles' || (s === 'equal' && equalStore === 'coles');
    });
    // Invariant: wwItems ∪ colesItems === displayItems (no item in both or neither)
    return { wwItems, colesItems };
  }

  // The lists the page renders: split → cheapest-at-each-store; single → the
  // WHOLE basket under one store (default: the cheaper overall total).
  function singleStoreNow() {
    if (chosenStore) return chosenStore;
    const { wwTotal, coTotal } = computeTotals();
    return wwTotal <= coTotal ? 'ww' : 'coles';
  }
  function currentLists() {
    if (slSplit) return computeSplit();
    return singleStoreNow() === 'ww'
      ? { wwItems: displayItems, colesItems: [] }
      : { wwItems: [], colesItems: displayItems };
  }

  function buildTable(storeItems, store, sortKey, sortDir) {
    if (!storeItems.length) return `<p class="only-note">No items are cheapest at ${store === 'ww' ? 'Woolworths' : 'Coles'} in this selection.</p>`;
    const pfx    = store === 'ww' ? 'ww' : 'coles';
    const sorted = sortItems(storeItems, store, sortKey, sortDir);
    const subtotal = sorted.reduce((s, i) =>
      s + (lineCostFor(i, store) ?? 0), 0);
    const arrow = (key) => sortKey === key ? (sortDir === 'asc' ? ' ↑' : ' ↓') : ' ↕';
    const rows = sorted.map(i => {
      const own = store === 'ww' ? i.woolworths : i.coles;
      const other = store === 'ww' ? i.coles : i.woolworths;
      // Single mode: an item this store doesn't sell shows the OTHER store's
      // price with a chip - you'd have to grab those few elsewhere anyway.
      const fellBack = !slSplit && own?.price == null && other?.price != null;
      const sd = fellBack ? other : own;
      const units = bq(i.list_item);
      // The store this row's price/pick/packs actually come from (fellback rows
      // borrow everything from the other store).
      const rowStore = fellBack ? (store === 'ww' ? 'coles' : 'ww') : store;
      const rowPacks = packsOf(i, rowStore);
      // Multi-buy applies to PACKS at the register, not basket rows. Category
      // rows are priced by rate (see groupStoreTotal), so no promo maths there.
      const rowUnits = units;
      const rowMb = i._isGroup ? null : mbOf(i, rowStore);
      // The price this row shows, and its total = that price x the qty shown.
      const shownPrice = effPrice(i, rowStore);
      const rowQty = i._isGroup ? groupUnits(i.list_item) : units;
      const lineTotal = lineCostFor(i, store) ?? 0;
      const mbSaved = rowMb ? +((rowUnits * (sd?.price ?? 0)) - lineTotal).toFixed(2) : 0;
      // Either "you're getting the deal" or "one more unit and you would be".
      // The per-unit price above is untouched either way.
      const nudge = (rowMb && sd?.price != null) ? multiBuyNudge(rowUnits, sd.price, rowMb) : null;
      // A tag icon beside the total, not a wrapping second line. Full wording
      // (deal terms + exact saving) is in the hover title. `saved` = the deal is
      // already in this total (green); `hint` = one more unit reaches it (muted).
      const mbNote = rowMb
        ? (mbSaved > 0
            ? mbTag('saved', `${rowMb.qty} for ${fmt(rowMb.total)} multi-buy - already applied, saving ${fmt(mbSaved)} on this line`)
            : nudge
              ? mbTag('hint', `Buy ${nudge.need} more to get ${rowMb.qty} for ${fmt(rowMb.total)} and save ${fmt(nudge.saving)}`)
              : '')
        : '';
      const cat = getCategory(i, catOv);
      const img = sd?.image_url;
      // Split mode: ⇄ swaps the row to the other store. When the other store
      // doesn't sell it the button stays but disabled - a consistent column
      // beats buttons that silently vanish on some rows.
      const canSwap = slSplit && own?.price != null && other?.price != null;
      const swapDisabled = slSplit && own?.price != null && other?.price == null;
      const swapTo = store === 'ww' ? 'coles' : 'ww';
      const swapTitle = canSwap
        ? (store === 'ww' ? 'Buy at Coles instead' : 'Buy at Woolworths instead')
        : `Only sold at ${store === 'ww' ? 'Woolworths' : 'Coles'}`;
      // Not sold at this store: the whole row renders grayed (CSS .row-fellback)
      // with a quiet dash after the price - the loud "C only" chip made a
      // borrowed row look like a full citizen of the wrong store's list.
      const onlyChip = fellBack
        ? ` <span class="from-other" title="Not sold at ${store === 'ww' ? 'Woolworths' : 'Coles'} - you'd buy this at ${store === 'ww' ? 'Coles' : 'Woolworths'} (its price shown)">–</span>`
        : '';
      // The other store's price rides along muted - switching stores (or
      // deciding a ⇄ swap) needs both numbers in view. For per-kg category rows
      // it's the packs-scaled cost (the comparable number), not a lone sticker.
      // The other store's multi-buy rides along too (compact "2/$6") - deciding
      // a ⇄ swap on its shelf price alone hid that the other side becomes
      // cheaper at the promo quantity.
      const altStore = store === 'ww' ? 'coles' : 'ww';
      const altMb = !fellBack ? mbOf(i, altStore) : null;
      const altMbTxt = altMb ? ` <span class="alt-mb" title="${store === 'ww' ? 'Coles' : 'Woolworths'} multi-buy: ${altMb.qty} for ${fmt(altMb.total)}">${altMb.qty}/${fmt(altMb.total)}</span>` : '';
      const altPrice = (!fellBack && other?.price != null)
        ? ` <span class="alt-price" title="${store === 'ww' ? 'Coles' : 'Woolworths'} price${i._isGroup ? ' at the same total weight' : ''}">${store === 'ww' ? 'C' : 'W'} ${fmt(effPrice(i, altStore))}${altMbTxt}</span>`
        : '';
      const name = escAttr(i.list_item);
      // Category entry: show WHICH product this store's side actually is (the
      // fellback row borrows the other store's pick, like any borrowed price).
      const pickName = i._isGroup ? (rowStore === 'ww' ? i._wwPickName : i._coPickName) : null;
      const qtyLabel = i._isGroup ? pickQty(i, rowStore) : '';
      const pickHtml = pickName
        ? `<div class="bg-pick" title="${escAttr(pickName)}">→ ${esc(shortName(pickName))}${qtyLabel ? ` <span class="bg-qty">(${qtyLabel})</span>` : ''}</div>`
        : '';
      return `<tr${fellBack ? ' class="row-fellback"' : ''}>
        <td class="item-name-cell"><div class="name-wrap">${img ? `<img class="sl-thumb" loading="lazy" src="${escAttr(img)}" alt="" onerror="this.style.display='none'">` : ''}<span title="${escAttr(i._isGroup ? i._groupLabel : i.list_item)}">${esc(dispName(i))}</span></div>${pickHtml}</td>
        <td class="cat-cell" style="font-size:12px;color:#64748B;overflow:hidden;text-overflow:ellipsis">${esc(cat)}</td>
        <td class="r price-cell"><span class="price-val">${fmt(shownPrice)}${i._isGroup && i._unitSuffix ? `<span class="pv-suffix">${i._unitSuffix}</span>` : ''}</span>${onlyChip}${altPrice}</td>
        <td class="r qty-cell"><div class="qty-step"><button type="button" class="qs-btn" data-item="${name}" data-d="-1" aria-label="Decrease quantity">−</button><span class="qs-val"${i._isGroup && rowPacks > 1 ? ` title="About ${rowPacks} × ${pickQty(i, rowStore)} packs to cover this"` : ''}>${i._isGroup ? (i._unitSuffix ? `${rowQty.toFixed(1)}kg` : rowQty) : units}</span><button type="button" class="qs-btn" data-item="${name}" data-d="1" aria-label="Increase quantity">+</button></div></td>
        <td class="r total-cell"><span class="total-val">${fmt(lineTotal)}</span>${mbNote}</td>
        <td class="act-cell"><div class="act-wrap">${canSwap || swapDisabled ? `<button type="button" class="row-btn swap" data-item="${name}" data-to="${swapTo}" title="${swapTitle}"${swapDisabled ? ' disabled' : ''}>⇄</button>` : ''}<button type="button" class="row-btn rm" data-item="${name}" title="Remove from basket">✕</button></div></td>
      </tr>`;
    }).join('');
    return `<div class="sl-table-wrap"><table>
      <colgroup>
        <col>
        <col style="width:110px">
        <col style="width:112px">
        <col style="width:92px">
        <col style="width:86px">
        <col style="width:72px">
      </colgroup>
      <thead><tr>
        <th class="sl-sort-hdr" data-col="item" data-sort-store="${pfx}" data-sort-key="item">Item${arrow('item')}</th>
        <th class="sl-sort-hdr" data-col="category" data-sort-store="${pfx}" data-sort-key="category">Category${arrow('category')}</th>
        <th class="r sl-sort-hdr" data-col="price" data-sort-store="${pfx}" data-sort-key="price">Price${arrow('price')}</th>
        <th class="r" data-col="qty">Qty</th>
        <th class="r sl-sort-hdr" data-col="total" data-sort-store="${pfx}" data-sort-key="total">Total${arrow('total')}</th>
        <th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td><strong>Subtotal</strong></td><td></td><td></td><td></td><td class="r"><strong>${fmt(subtotal)}</strong></td><td></td></tr></tfoot>
    </table></div>`;
  }

  // ── Shopping mode state ────────────────────────────────────────────────────
  // 'list' = the classic two-table view; 'shop' = big tap-to-check rows for
  // in-store use. Checked-off names persist in localStorage so the trip survives
  // a refresh; stale names (items no longer in the basket) are simply ignored.
  let slMode = localStorage.getItem('pw_sl_mode') === 'shop' ? 'shop' : 'list';
  // Shopping mode is an IN-STORE tool - phone only. On desktop always render
  // the list (and hide the toggle via CSS on .sl-shop-seg).
  if (window.innerWidth > 700) slMode = 'list';
  let smChecked = {};
  try { smChecked = JSON.parse(localStorage.getItem('pw_shop_checked_v1') || '{}'); } catch {}
  const saveSmChecked = () => localStorage.setItem('pw_shop_checked_v1', JSON.stringify(smChecked));

  const segHtml = () => `
    <div class="sl-mode-seg sl-shop-seg">
      <button class="sl-mode-btn${slMode === 'list' ? ' active' : ''}" data-mode="list">📋 List</button>
      <button class="sl-mode-btn${slMode === 'shop' ? ' active' : ''}" data-mode="shop">🛒 Shopping mode</button>
    </div>`;
  // The One-store/Split-shop choice is THE page-level decision, so its toggle
  // renders in BOTH list and shopping mode (it used to vanish in shop mode).
  // Split shop grays out when the plan would put every item in the same store -
  // there is nothing to split, so entering the mode would only mislead.
  const splitSegHtml = () => {
    const canSplit = computePlan().splits;
    return `
    <div class="sl-mode-seg sl-split-seg" id="splitSeg">
      <button class="sl-mode-btn${!slSplit ? ' active' : ''}" data-splitmode="0" title="Buy the whole basket at one store">🏬 One store</button>
      <button class="sl-mode-btn${slSplit ? ' active' : ''}" data-splitmode="1"${!canSplit && !slSplit ? ' disabled' : ''} title="${!canSplit && !slSplit ? 'Nothing to split - every item in this basket is cheapest at the same store' : 'Buy each item at whichever store is cheaper'}">🔀 Split shop</button>
    </div>`;
  };
  function wireSeg() {
    main.querySelectorAll('.sl-shop-seg .sl-mode-btn').forEach(b => b.addEventListener('click', () => {
      if (b.dataset.mode === slMode) return;
      slMode = b.dataset.mode;
      localStorage.setItem('pw_sl_mode', slMode);
      renderContent();
    }));
    main.querySelectorAll('#splitSeg .sl-mode-btn').forEach(b => b.addEventListener('click', () => {
      const want = b.dataset.splitmode === '1';
      if (want === slSplit) return;
      slSplit = want;
      storeOverride.clear(); // a mode switch starts from the clean default plan
      renderContent();
    }));
  }

  function renderShopMode(wwItems, colesItems) {
    const lineOf = (i, store) => lineCostFor(i, store) ?? 0;   // same rule as the table
    // Product shot for the row's own store, falling back to the rival's: it's the
    // same physical product on the shelf, so a Coles photo is still the right
    // thing to look for in a Woolworths aisle - and half the misses are one-store
    // scrape failures, not genuinely different products. Category groups already
    // expose their best variant as .woolworths/.coles, so one helper covers both.
    const imgFor = (i, store) => {
      const own   = store === 'ww' ? i.woolworths : i.coles;
      const other = store === 'ww' ? i.coles : i.woolworths;
      return (own && own.image_url) || (other && other.image_url) || '';
    };
    const rowsHtml = (items, store) => {
      // Category-grouped (≈ aisle order), name-sorted inside each group.
      const byCat = new Map();
      sortItems(items, store, 'category', 'asc').forEach(i => {
        const c = getCategory(i, catOv);
        if (!byCat.has(c)) byCat.set(c, []);
        byCat.get(c).push(i);
      });
      let html = '';
      for (const [cat, list] of byCat) {
        html += `<div class="sm-cat">${esc(cat)}</div>`;
        html += list.map(i => {
          // Shopping mode = what you grab off the shelf: whole packs for a
          // category row, basket qty for a normal product.
          const units = i._isGroup ? packsOf(i, store) : bq(i.list_item);
          const line = lineOf(i, store);
          const done = !!smChecked[i.list_item];
          const img = imgFor(i, store);
          return `<button type="button" class="sm-row${done ? ' done' : ''}" data-item="${escAttr(i.list_item)}" data-line="${line.toFixed(2)}">
            <span class="sm-check">${done ? '✓' : ''}</span>
            <span class="sm-thumb">${img ? `<img src="${escAttr(img)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ''}</span>
            <span class="sm-name" title="${escAttr(i._isGroup ? i._groupLabel : i.list_item)}">${esc(dispName(i))}${i._isGroup && pickQty(i, store) ? ` <span class="sm-sub">${pickQty(i, store)}</span>` : ''}</span>
            ${units > 1 ? `<span class="sm-qty">× ${units}</span>` : ''}
            <span class="sm-price">${fmt(line)}</span>
          </button>`;
        }).join('');
      }
      return html;
    };
    const storeSection = (items, store) => !items.length ? '' : `
      <div class="sm-store-h">
        <span class="store-chip ${store === 'ww' ? 'ww' : 'coles'}">${store === 'ww' ? 'W' : 'C'}</span>
        <span class="section-title">${store === 'ww' ? 'Woolworths' : 'Coles'}</span>
        <span class="section-count">${items.length} item${items.length !== 1 ? 's' : ''}</span>
      </div>
      ${rowsHtml(items, store)}`;

    main.innerHTML = `
      <div class="sl-topbar">
        ${splitSegHtml()}
        ${segHtml()}
        <div class="sl-note">📋 ${filterNoteHtml()} <span class="sl-rate-note">How these totals are calculated${infoIcoHTML(TOTALS_RULE_TIP)}</span></div>
        <div class="sl-flexspacer" style="flex:1"></div>
        <button id="smResetBtn" class="btn-outline-danger">↺ Reset picks</button>
      </div>
      <div class="sm-progress-card">
        <div class="sm-progress-top">
          <span class="sm-count"><span id="smPicked">0</span> of <span id="smTotal">0</span> picked</span>
          <span class="sm-total-wrap">In trolley <span class="sm-total" id="smSpend">$0.00</span></span>
        </div>
        <div class="sm-bar-track"><div class="sm-bar-fill" id="smBar"></div></div>
        <div class="sm-store-chips">${wwItems.length ? `<span class="sm-chip smw">W · ${wwItems.length}</span>` : ''}${colesItems.length ? `<span class="sm-chip smc">C · ${colesItems.length}</span>` : ''}</div>
      </div>
      ${storeSection(wwItems, 'ww')}
      ${storeSection(colesItems, 'coles')}
    `;
    wireSeg();

    const updateProgress = () => {
      const rows = [...main.querySelectorAll('.sm-row')];
      const done = rows.filter(r => r.classList.contains('done'));
      const spend = done.reduce((s, r) => s + (parseFloat(r.dataset.line) || 0), 0);
      document.getElementById('smPicked').textContent = done.length;
      document.getElementById('smTotal').textContent = rows.length;
      document.getElementById('smSpend').textContent = fmt(spend);
