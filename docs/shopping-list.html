      document.getElementById('smBar').style.width = rows.length ? Math.round(done.length / rows.length * 100) + '%' : '0';
    };
    main.querySelectorAll('.sm-row').forEach(row => {
      row.addEventListener('click', () => {
        const name = row.dataset.item;
        const nowDone = !row.classList.contains('done');
        row.classList.toggle('done', nowDone);
        row.querySelector('.sm-check').textContent = nowDone ? '✓' : '';
        if (nowDone) smChecked[name] = 1; else delete smChecked[name];
        saveSmChecked();
        updateProgress();
      });
    });
    document.getElementById('smResetBtn')?.addEventListener('click', () => {
      if (!confirm('Clear all picks and start a fresh trip?')) return;
      smChecked = {};
      saveSmChecked();
      renderContent();
    });
    updateProgress();
  }

  // "Worth the detour?" - one-store mode only. Silent unless a handful of items
  // carry most of the split saving; see detourAdvice in utils.js for the bar.
  // Dismissed per basket (the set of items), not per session: change the basket
  // and the question is a different one, so it deserves asking again.
  function detourKey() {
    return displayItems.map(i => i.list_item).sort().join('|');
  }
  function detourOff() {
    try { return localStorage.getItem('pw_detour_off') === '1'; } catch { return false; }
  }
  function detourDismissed() {
    try { return detourOff() || localStorage.getItem('pw_detour_hid') === detourKey(); }
    catch { return false; }
  }
  function buildDetourHtml() {
    if (slSplit) return '';
    // "Don't show again" wrote a localStorage flag with nothing anywhere to
    // clear it - the feature could be switched off permanently by one click and
    // never brought back. Off now leaves this one line behind, which both
    // explains where the tip went and undoes it.
    if (detourOff()) {
      return `<div class="detour-off" id="detourOffBar">
          Cheaper-elsewhere tips are off.
          <button type="button" id="detourRestore">Turn them back on</button>
        </div>`;
    }
    if (detourDismissed()) return '';
    const here = singleStoreNow();                 // 'ww' | 'coles'
    const other = here === 'ww' ? 'coles' : 'ww';
    const rows = displayItems.map(i => {
      const a = lineCostFor(i, here), b = lineCostFor(i, other);
      if (a == null || b == null) return null;     // not sold at both: not a choice
      return { name: dispName(i), key: i.list_item, here: a, there: b, saving: a - b };
    }).filter(Boolean);
    const adv = detourAdvice(rows);
    if (!adv) return '';
    const otherName = other === 'ww' ? 'Woolworths' : 'Coles';
    const chip = `<span class="store-chip sm ${other === 'ww' ? 'ww' : 'coles'}">${other === 'ww' ? 'W' : 'C'}</span>`;
    const hereChip = `<span class="store-chip sm ${here === 'ww' ? 'ww' : 'coles'}">${here === 'ww' ? 'W' : 'C'}</span>`;
    const list = adv.items.map(r => `
      <div class="dt-row">
        <span class="dt-name">${esc(r.name)}</span>
        <span class="dt-p dt-from">${hereChip}<span class="dt-amt">${fmt(r.here)}</span></span>
        <span class="dt-arrow">&rarr;</span>
        <span class="dt-p dt-to">${chip}<span class="dt-amt">${fmt(r.there)}</span></span>
        <span class="dt-save">save ${fmt(r.saving)}</span>
      </div>`).join('');
    const rest = adv.restCount > 0
      ? `<div class="dt-verdict"><strong>The other ${adv.restCount} aren't worth it.</strong>
           Splitting everything saves ${fmt(adv.total)}, only ${fmt(adv.restTotal)} more than
           moving these ${adv.items.length}. One extra stop, not a second full shop.</div>`
      : '';
    return `<div class="detour" id="detourBox">
        <div class="dt-h"><span>&#128161;</span> <span class="dt-title">${adv.items.length} item${adv.items.length !== 1 ? 's' : ''} much cheaper at ${otherName}</span>
          <span class="dt-pct">${Math.round(adv.share * 100)}% of your split saving</span>
          <button class="dt-x" id="detourHide" title="Hide for this basket">&#10005;</button></div>
        <div class="dt-sub">Worth <strong>${fmt(adv.topTotal)}</strong> between them.</div>
        ${list}
        <div class="dt-foot">
          <span class="dt-total">Buy ${adv.items.length === 1 ? 'this one' : `these ${adv.items.length}`} at ${otherName} &rarr; save <b>${fmt(adv.topTotal)}</b></span>
          <button class="btn btn-ghost" id="detourNever">Don't show again</button>
          <button class="btn btn-primary" id="detourMove">Move to ${otherName}</button>
        </div>
        ${rest}
      </div>`;
  }

  // renderContent() re-runs on every state change: equalStore, sort, qty
  // stepper, row removal, store swap. All derived numbers are computed here.
  function renderContent() {
    const { wwItems, colesItems } = currentLists();
    if (slMode === 'shop') { renderShopMode(wwItems, colesItems); return; }
    const { wwTotal, coTotal, diff, isEqual } = computeTotals();
    const plan = computePlan();
    // Split mode: planned spend per store under the current assignment
    // (equal-price choice + per-row ⇄ swaps) - shown on the cards there.
    const subtotalOf = (items, store) => items.reduce((s, i) =>
      s + (lineCostFor(i, store) ?? 0), 0);
    const wwSub = subtotalOf(wwItems, 'ww');
    const coSub = subtotalOf(colesItems, 'coles');
    // Equal-price items (same EFFECTIVE cost at both stores - packs-scaled for
    // per-kg category rows) - reassignable in split mode. Matches the split
    // routing's comparison exactly.
    const equalItems = displayItems.filter(i => cheaperStoreNow(i) === 'equal');
    const single = slSplit ? null : singleStoreNow();
    // Card "active" highlight only means something in single mode (the store
    // you're buying the whole basket at). Split-mode cards are two REAL
    // subtotals for two different item sets - neither is "selected", so
    // neither is clickable and neither is highlighted over the other.
    const wwActive = !slSplit && single === 'ww';

    // Card classes - the store class lets the active card carry its own store colour
    const wwCardCls = `store-card-sl ww ${slSplit ? 'card-neutral' : (wwActive ? 'card-active' : 'card-inactive')}`;
    const coCardCls = `store-card-sl coles ${slSplit ? 'card-neutral' : (!wwActive ? 'card-active' : 'card-inactive')}`;

    // Price colour - active card always green, inactive always grey, split mode neutral
    const wwPriceCls = slSplit ? '' : (wwActive ? 'price-active' : 'price-inactive');
    const coPriceCls = slSplit ? '' : (!wwActive ? 'price-active' : 'price-inactive');

    // Inactive card shows its distance from the chosen store's total. Single
    // mode only - split cards cover different item sets, so a delta between
    // them is meaningless. Signed: picking the dearer store makes it negative.
    const wwDelta = (!slSplit && !isEqual && !wwActive) ? wwTotal - coTotal : null;
    const coDelta = (!slSplit && !isEqual &&  wwActive) ? coTotal - wwTotal : null;
    const deltaHtml = d => d == null ? '' : `<span class="sc-delta">${d >= 0 ? '+' : '−'}${fmt(Math.abs(d))}</span>`;

    // ── Save ribbon ──────────────────────────────────────────────────────────
    // Cheaper-store counts are multi-buy AND qty aware (cheaperStoreNow →
    // lineCost), so they flip with the stepper exactly like the totals and the
    // split routing - no more "cheaper at WW" on an item a "2 for $4" makes
    // cheaper at Coles the moment you buy 2.
    const wwOnlyCount = displayItems.filter(i => cheaperStoreNow(i) === 'ww').length;
    const coOnlyCount = displayItems.filter(i => cheaperStoreNow(i) === 'coles').length;
    const ribbonChips = [
      wwOnlyCount > 0    ? `<span class="bar-store-chip ww-chip" title="${wwOnlyCount} cheaper at Woolworths"><span class="store-chip ww">W</span>${wwOnlyCount}<span class="chip-word"> at Woolworths</span></span>` : '',
      equalItems.length > 0 ? `<span class="bar-store-chip eq-chip" title="${equalItems.length} same price at both">${equalItems.length}<span class="chip-word"> equal-price</span></span>` : '',
      coOnlyCount > 0    ? `<span class="bar-store-chip co-chip" title="${coOnlyCount} cheaper at Coles"><span class="store-chip coles">C</span>${coOnlyCount}<span class="chip-word"> at Coles</span></span>` : '',
    ].join('');

    // Savings shown with the SAME "Basket saving / Split shop" component as the
    // main page (renderSavingInfo): cheaper-store chip + the two headline numbers.
    const cheaperTotal = Math.min(wwTotal, coTotal);
    const dearerTotal  = Math.max(wwTotal, coTotal);
    const basketSaving = dearerTotal - cheaperTotal;   // buy all at the cheaper single store vs the dearer
    const splitSaving  = dearerTotal - plan.total;     // the split PLAN vs the dearer single store
    const savingCheaperChip = (wwTotal <= coTotal)
      ? '<span class="store-chip sm ww">W</span>' : '<span class="store-chip sm coles">C</span>';
    const splitDisc = `<svg class="split-icon" width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 A14 14 0 0 0 16 30 Z" fill="var(--ww)"/><path d="M16 2 A14 14 0 0 1 16 30 Z" fill="var(--coles)"/><line x1="16" y1="2" x2="16" y2="30" stroke="var(--card)" stroke-width="2.5"/></svg>`;
    const infoIco = tip => `<span class="info-ico" tabindex="0" data-tip="${tip.replace(/"/g, '&quot;')}">?</span>`;
    // The centre panel carries SAVINGS only ("You save" for the split plan,
    // "One-store saving" for a single-store trip). The split trip's PRICE lives
    // in split mode itself: a big combined Trip total above the savings, so the
    // two per-store subtotals get one headline number - not a third stat
    // wedged between savings figures.
    // One-store mode prices missing items from the OTHER store so both card
    // totals cover the same item set (a fair comparison - a store isn't dearer
    // just because it stocks one more item). Say so on the card.
    const wwForeign = displayItems.filter(i => i.woolworths?.price == null && i.coles?.price != null).length;
    const coForeign = displayItems.filter(i => i.coles?.price == null && i.woolworths?.price != null).length;
    // Plain-language label: "not sold here" says outright why the card's total
    // includes a price you can't actually get at THIS store - the old "incl. N
    // from W" made you decode an abbreviation to find that out.
    const foreignNote = (n, from) => (!slSplit && n > 0)
      ? `<span class="sc-foreign" title="${n} item${n !== 1 ? 's' : ''} not sold here - counted using ${n !== 1 ? 'their' : 'its'} ${from} price so both totals cover the same items">${n} not sold here</span>`
      : '';
    // Basket saving (one-store) sits ABOVE Split saving, sharing one figure
    // layout so they read as a set: a right-aligned `.saving-figs` block with an
    // optional bold-green total then the saving as a green (−$X) bracket. The
    // brackets align in a column; the split row adds its trip total to the left.
    //   • Basket saving = bracket only (its total is the cheaper store card).
    //   • Split saving = bracket only too. It used to lead with the split trip
    //     total, but the "🧾 Split shop total" row directly underneath shows the
    //     identical figure - so the line read "$42.80 (−$2.30)" with the $42.80
    //     repeated two rows down. A saving line should show the saving.
    //     Only shown when the plan actually splits AND beats the cheaper single
    //     store - else it's noise ("$5.80 split saving" while the plan put
    //     everything in one store was the reported bug).
    const svLine = (icon, label, tip, figs) =>
      `<div class="saving-line"><span class="saving-icon">${icon}</span><div class="saving-text"><div class="saving-label">${label}${infoIco(tip)}</div><div class="saving-figs">${figs}</div></div></div>`;
    const svDisc = v => `<span class="sv-disc">(−${fmt(v)})</span>`;
    const basketSavingLine = isEqual
      ? `<div class="saving-line"><span class="saving-icon">⚖</span><div class="saving-text"><div class="saving-label">Both stores</div><span class="saving-amount" style="color:var(--text-mid)">Same price</span></div></div>`
      : svLine(savingCheaperChip, 'Basket saving',
          'Buy everything at the cheaper store instead of the dearer one - this is what you save.', svDisc(basketSaving));
    const showSplitLine = plan.splits && splitSaving > basketSaving + 0.005;
    const splitSavingLine = showSplitLine
      ? svLine(splitDisc, 'Split saving',
          'Buying each item at whichever store is cheapest for it costs this total - the bracket is the extra you save vs shopping at one store only. Use the Split shop toggle to plan it.',
          // The trip total shows ONLY in one-store mode. Split mode renders a
          // "🧾 Split shop total" row two lines down carrying the same figure,
          // so printing it here too read as "$42.80 (−$2.30)" with the $42.80
          // repeated underneath. One-store mode has no such row, so dropping it
          // there would lose the number rather than de-duplicate it.
          `${slSplit ? '' : `<span class="sv-total">${fmt(plan.total)}</span>`}${svDisc(splitSaving)}`)
      : '';
    const savingInfoHtml = basketSavingLine + splitSavingLine;

    main.innerHTML = `
      <div class="sl-topbar">
        ${splitSegHtml()}
        ${segHtml()}
        <div class="sl-note">📋 ${filterNoteHtml()} <span class="sl-rate-note">How these totals are calculated${infoIcoHTML(TOTALS_RULE_TIP)}</span></div>
        <div class="sl-flexspacer" style="flex:1"></div>
        <button id="removeAllBtn" class="btn-outline-danger">🗑 Remove All</button>
      </div>

      <div class="store-summary-wrap">
        <div class="store-cards-grid">
          <div class="${wwCardCls}" id="wwTotalBlock">
            <div class="sc-icon"><span class="sc-icon-chip ww">W</span></div>
            <div class="sc-name-row">
              <span class="sc-store-name">Woolworths</span>
              <span class="sc-item-pill">${slSplit ? `${wwItems.length} item${wwItems.length !== 1 ? 's' : ''}`
                : (wwForeign > 0 ? `${displayItems.length - wwForeign}/${displayItems.length} items` : `all ${displayItems.length} items`)}</span>
            </div>
            <div class="sc-price ${wwPriceCls}">${fmt(slSplit ? wwSub : wwTotal)}</div>
            <div class="sc-foreign-row">${foreignNote(wwForeign, 'Coles')}</div>
            <div class="sc-badge-row">${slSplit ? '' : (wwActive && !isEqual ? '<span class="sc-badge">✓ Buying here</span>' : deltaHtml(wwDelta))}</div>
          </div>
          <div class="sl-savings-panel">
            <div class="saving-info">${savingInfoHtml}</div>
            <div class="bar-ribbon-chips">${ribbonChips}</div>
          </div>
          <div class="${coCardCls}" id="colesTotalBlock">
            <div class="sc-icon"><span class="sc-icon-chip coles">C</span></div>
            <div class="sc-name-row">
              <span class="sc-store-name">Coles</span>
              <span class="sc-item-pill">${slSplit ? `${colesItems.length} item${colesItems.length !== 1 ? 's' : ''}`
                : (coForeign > 0 ? `${displayItems.length - coForeign}/${displayItems.length} items` : `all ${displayItems.length} items`)}</span>
            </div>
            <div class="sc-price ${coPriceCls}">${fmt(slSplit ? coSub : coTotal)}</div>
            <div class="sc-foreign-row">${foreignNote(coForeign, 'Woolworths')}</div>
            <div class="sc-badge-row">${slSplit ? '' : (!wwActive && !isEqual ? '<span class="sc-badge">✓ Buying here</span>' : deltaHtml(coDelta))}</div>
          </div>
          ${slSplit ? `<div class="trip-bar"><span class="tb-label">🧾 Split shop total</span><strong>${fmt(wwSub + coSub)}</strong></div>` : ''}
        </div>
      </div>

      ${buildDetourHtml()}

      ${!wwItems.length && !slSplit ? '' : `<div class="store-section">
        <div class="section-header">
          <span class="store-chip ww">W</span>
          <span class="section-title">Buy at Woolworths</span>
          <span class="section-count">${wwItems.length} item${wwItems.length !== 1 ? 's' : ''}</span>
        </div>
        ${buildTable(wwItems, 'ww', wwSortKey, wwSortDir)}
      </div>`}

      ${!colesItems.length && !slSplit ? '' : `<div class="store-section">
        <div class="section-header">
          <span class="store-chip coles">C</span>
          <span class="section-title">Buy at Coles</span>
          <span class="section-count">${colesItems.length} item${colesItems.length !== 1 ? 's' : ''}</span>
        </div>
        ${buildTable(colesItems, 'coles', colesSortKey, colesSortDir)}
      </div>`}
    `;

    // Wire sort header clicks (per-table, independent state)
    document.querySelectorAll('.sl-sort-hdr').forEach(th => {
      th.addEventListener('click', () => {
        const s = th.dataset.sortStore, k = th.dataset.sortKey;
        if (s === 'ww') {
          wwSortDir = wwSortKey === k ? (wwSortDir === 'asc' ? 'desc' : 'asc') : 'asc';
          wwSortKey = k;
        } else {
          colesSortDir = colesSortKey === k ? (colesSortDir === 'asc' ? 'desc' : 'asc') : 'asc';
          colesSortKey = k;
        }
        renderContent();
      });
    });

    // (One-store ⇄ Split-shop toggle is wired by wireSeg(), shared with
    // shopping mode.)

    // Store-card clicks: single mode only, to choose which store to buy the
    // whole basket at (resets any per-row ⇄ swaps back to the default plan).
    // Split mode cards used to be clickable to reassign equal-price items, but
    // an equal-price item costs the same either way - the click changed which
    // table a row appeared in and nothing else, which read as "does nothing".
    // Removed rather than fixed: there was nothing worth fixing it into.
    if (!slSplit) {
      const cardClick = (store) => () => {
        storeOverride.clear();
        chosenStore = store;
        renderContent();
      };
      document.getElementById('wwTotalBlock')?.addEventListener('click', cardClick('ww'));
      document.getElementById('colesTotalBlock')?.addEventListener('click', cardClick('coles'));
    }

    // Qty steppers - cart quantities only (persisted with the basket). They no
    // longer touch pw_units_v1: that map is the main page's kg-planning Units
    // column, a different concept from "how many packs am I buying".
    main.querySelectorAll('.qs-btn').forEach(b => b.addEventListener('click', () => {
      const name = b.dataset.item;
      const d = Number(b.dataset.d);
      // Category rows step the SHARED quantity (pw_units_v1) the main page's
      // Units column writes - that is what keeps the two pages' totals equal.
      // Weighed categories step in 0.2kg, like the main page; packs step by 1.
      if (name.startsWith('__group_')) {
        const weighed = !UNIT_BASED_GROUPS.has(name.slice(8)) && !stickerGroups().has(name.slice(8));
        const step = weighed ? 0.2 : 1;
        const next = Math.max(step, +(groupUnits(name) + d * step).toFixed(1));
        const ov = loadUnitOverrides();
        ov[name] = next;
        localStorage.setItem('pw_units_v1', JSON.stringify(ov));
        renderContent();
        return;
      }
      const next = Math.max(1, bq(name) + d);
      if (next === bq(name)) return;
      basketQty[name] = next;
      persistBasket();
      renderContent();
    }));

    // Per-row remove - drops the item from the basket (not from PriceWatch).
    main.querySelectorAll('.row-btn.rm').forEach(b => b.addEventListener('click', () => {
      const name = b.dataset.item;
      displayItems = displayItems.filter(i => i.list_item !== name);
      storeOverride.delete(name);
      persistBasket();
      renderContent(); // 0 items renders the normal screen, just empty
    }));

    // Per-row store swap - "I'll just buy it here anyway" for one-store trips.
    main.querySelectorAll('.row-btn.swap').forEach(b => b.addEventListener('click', () => {
      storeOverride.set(b.dataset.item, b.dataset.to);
      renderContent();
    }));

    // Detour prompt. "Move" switches to split mode and pins ONLY these rows to
    // the other store - everything else keeps following the default plan, which
    // is what makes this "one extra stop" rather than "split the whole shop".
    document.getElementById('detourHide')?.addEventListener('click', () => {
      try { localStorage.setItem('pw_detour_hid', detourKey()); } catch {}
      renderContent();
    });
    document.getElementById('detourNever')?.addEventListener('click', () => {
      try { localStorage.setItem('pw_detour_off', '1'); } catch {}
      renderContent();
    });
    document.getElementById('detourRestore')?.addEventListener('click', () => {
      // Clears the per-basket dismissal too, or the tip would come back on and
      // still be hidden for whatever is in the basket right now.
      try { localStorage.removeItem('pw_detour_off'); localStorage.removeItem('pw_detour_hid'); } catch {}
      renderContent();
    });
    document.getElementById('detourMove')?.addEventListener('click', () => {
      const here = singleStoreNow();
      const other = here === 'ww' ? 'coles' : 'ww';
      const rows = displayItems.map(i => {
        const a = lineCostFor(i, here), b = lineCostFor(i, other);
        return (a == null || b == null) ? null
             : { name: dispName(i), key: i.list_item, saving: a - b };
      }).filter(Boolean);
      const adv = detourAdvice(rows);
      if (!adv) return;
      // Pin EVERY row, not just the chosen few. Split mode re-routes anything
      // unpinned by price, so pinning only the 3 turned "one extra stop" into
      // "split the whole shop" - 19 rows moved instead of 2, which is precisely
      // what this prompt's own verdict line argues against. Everything else is
      // pinned to the store already being shopped, so the plan really is
      // "that shop, plus these".
      displayItems.forEach(i => storeOverride.set(i.list_item, here));
      adv.items.forEach(r => storeOverride.set(r.key, other));
      slSplit = true;
      renderContent();
      showToast?.(`✓ Moved ${adv.items.length} item${adv.items.length !== 1 ? 's' : ''} to ${other === 'ww' ? 'Woolworths' : 'Coles'} - saving ${fmt(adv.topTotal)}.`);
    });

    document.getElementById('removeAllBtn')?.addEventListener('click', () => {
      if (confirm('Remove all items from your basket?')) {
        localStorage.removeItem('pw_sl_handoff');
        window.pwSyncBasketBadge?.();   // header.js - clears the 🛒 count
        displayItems = [];
        storeOverride.clear();
        renderContent(); // normal screen, just empty
      }
    });


    initSlResize();
    wireSeg();
  }

  renderContent();
}

boot();

// ── Bell notifications + validate link ───────────────────────────────────────
(async function initNavBell() {
  // Show/hide validate nav link based on pending_validation count
  const validateLink = document.getElementById('validateNavLink');
  if (validateLink) {
    try {
      const r = await fetch(`data/latest.json?t=${Date.now()}`);
      if (r.ok) {
        const data = await r.json();
        const count = pendingValidationCount(data.pending_validation);
        validateLink.style.display = count > 0 ? '' : 'none';
        // textContent would wipe the icon header.js already put there - the
        // tooltip and a small corner count badge carry the count instead.
        if (count > 0) {
          validateLink.title = `Validate (${count} pending)`;
          let badge = validateLink.querySelector('.validate-badge');
          if (!badge) {
            badge = document.createElement('span');
            badge.className = 'validate-badge';
            validateLink.appendChild(badge);
          }
          badge.textContent = count;
        }
      }
    } catch {}
  }
  // (Notification bell retired - the validate pill above is the single
  // "data needs attention" surface.)
})();
</script>

  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloaded) return;
    reloaded = true;
    location.reload();
  });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(() => {}));
}
</script>
