<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔥 Hot Deals — PriceWatch</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Hot Deals page overrides ── */
    .deals-hero {
      background: linear-gradient(135deg, #fff7ed 0%, #fef3c7 100%);
      border-bottom: 1px solid #fde68a;
      padding: 20px 24px 16px;
    }
    .deals-hero-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .deals-hero-sub {
      font-size: 13px;
      color: var(--text-mid);
    }
    .deals-hero-stats {
      display: flex;
      gap: 20px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .deals-hero-stat {
      background: #fff;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      color: var(--text-mid);
    }
    .deals-hero-stat strong {
      color: var(--text);
      font-weight: 700;
    }

    /* ── Filter bar ── */
    .deals-filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .deals-filter-label {
      font-size: 12px;
      color: var(--text-soft);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    /* ── Category tabs ── */
    .category-tabs {
      padding: 0 24px;
    }

    /* ── Deals table ── */
    .deals-table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .deals-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .deals-table thead th {
      background: var(--card);
      border-bottom: 2px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-mid);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    .deals-table thead th:hover { background: var(--bg); }
    .deals-table thead th.sort-primary {
      color: var(--text);
      background: #f8fafc;
    }
    .deals-table thead th .sort-key-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #fff;
      border-radius: 10px;
      font-size: 9px;
      font-weight: 700;
      width: 14px;
      height: 14px;
      margin-left: 4px;
      vertical-align: middle;
    }
    .deals-table thead th .sort-key-badge.secondary {
      background: var(--text-soft);
    }
    .deals-table tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .deals-table tbody tr:hover { background: #fafbfc; }
    .deals-table td {
      padding: 10px 12px;
      vertical-align: middle;
    }

    /* ── Item cell ── */
    .deal-item-cell {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
    }
    .deal-img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 6px;
      flex-shrink: 0;
    }
    .deal-img-placeholder {
      width: 40px;
      height: 40px;
      background: var(--bg);
      border-radius: 6px;
      flex-shrink: 0;
    }
    .deal-item-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      line-height: 1.3;
    }
    .deal-item-cat {
      font-size: 11px;
      color: var(--text-soft);
      margin-top: 2px;
    }

    /* ── Deal score cell ── */
    .deal-score-cell {
      text-align: center;
    }
    .deal-pct {
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
    }
    .deal-pct.ww  { color: var(--ww); }
    .deal-pct.coles { color: var(--coles); }
    .deal-sub {
      font-size: 10px;
      color: var(--text-soft);
      margin-top: 2px;
    }
    .alltime-badge {
      display: inline-block;
      background: #f59e0b;
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      border-radius: 10px;
      padding: 1px 6px;
      margin-top: 4px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    /* ── Price cells ── */
    .deal-price-main {
      font-weight: 700;
      font-size: 14px;
      color: var(--text);
    }
    .deal-price-unit {
      font-size: 11px;
      color: var(--text-soft);
      margin-top: 1px;
    }
    .deal-was {
      font-size: 11px;
      color: var(--text-soft);
      text-decoration: line-through;
    }
    .deal-fire {
      font-size: 14px;
      margin-left: 2px;
    }

    /* ── Highlighted best-store cell ── */
    .cell-deal-ww  { background: var(--ww-light); }
    .cell-deal-coles { background: var(--coles-light); }

    /* ── Price bar (reused from main) ── */
    .price-bar-outer { cursor: help; margin-top: 4px; }
    .price-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--green-light), #fef9c3, #fee2e2);
      border-radius: 2px;
      position: relative;
      overflow: visible;
    }
    .price-marker {
      position: absolute;
      top: -3px;
      width: 8px;
      height: 10px;
      background: var(--text);
      border-radius: 2px;
      transform: translateX(-50%);
    }
    .price-bar-labels {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-soft);
      margin-top: 2px;
    }

    /* ── Empty state ── */
    .deals-empty {
      text-align: center;
      padding: 64px 24px;
      color: var(--text-soft);
    }
    .deals-empty-icon { font-size: 48px; margin-bottom: 12px; }
    .deals-empty-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 6px; }

    /* ── Sort controls bar ── */
    .sort-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 24px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-soft);
      flex-wrap: wrap;
    }
    .sort-bar-label { font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
    .sort-key-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
    }
    .sort-key-chip:first-of-type {
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }
    .sort-key-chip .chip-dir { font-size: 10px; }
    .sort-clear-btn {
      background: none;
      border: none;
      color: var(--text-soft);
      cursor: pointer;
      font-size: 12px;
      padding: 3px 6px;
    }
    .sort-clear-btn:hover { color: var(--text); }

    /* ── Fixed tooltip (same as main) ── */
    .price-tooltip-fixed {
      position: fixed;
      z-index: 9999;
      background: rgba(26,31,46,0.97);
      color: #fff;
      font-size: 12px;
      font-family: ui-monospace, monospace;
      padding: 10px 14px;
      border-radius: 8px;
      pointer-events: none;
      white-space: pre;
      max-width: 300px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-left">
      <a href="index.html" class="brand">
        <span class="store-chip ww">W</span>
        <span class="store-chip coles">C</span>
        <span class="brand-name">PriceWatch</span>
      </a>
      <nav>
        <a href="index.html">My Shopping List</a>
        <a href="hot-deals.html" class="active">🔥 Hot Deals</a>
      </nav>
    </div>
    <div class="header-right">
      <button class="btn btn-primary" id="refreshBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Update Prices
      </button>
    </div>
  </div>
</header>

<div class="deals-hero">
  <div class="deals-hero-title">🔥 Hot Deals</div>
  <div class="deals-hero-stats" id="heroStats"></div>
</div>

<!-- Category filter tabs -->
<div id="categoryTabs" class="category-tabs" style="padding-top:12px;padding-bottom:8px;background:var(--card);border-bottom:1px solid var(--border)"></div>

<!-- Filter bar: store pills -->
<div class="deals-filter-bar">
  <span class="deals-filter-label">Store</span>
  <div id="storeFilter" style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="store-filter-btn active" data-store="all">All Stores</button>

    <button class="store-filter-btn" data-store="coles"><span class="store-chip coles sm">C</span> Coles</button>
  </div>
</div>

<!-- Active sort keys display -->
<div class="sort-bar" id="sortBar" style="display:none">
  <span class="sort-bar-label">Sort:</span>
  <div id="sortKeyChips"></div>
  <button class="sort-clear-btn" id="sortClearBtn" title="Reset sort">✕ Clear</button>
</div>

<main style="padding:0 24px 40px">
  <div id="loading" class="loading-message" style="padding-top:48px">
    <div class="loading-spinner"></div>
    Loading price data…
  </div>
  <div id="dealsContainer" style="display:none">
    <div class="deals-table-wrap">
      <table class="deals-table">
        <thead id="dealsHead">
          <tr>
            <th data-col="name">Product <span class="sort-arrow"></span></th>
            <th data-col="deal" style="text-align:center">Deal <span class="sort-arrow"></span></th>
            <th data-col="ww">
              <span class="store-chip ww sm">W</span> WW Price <span class="sort-arrow"></span>
            </th>
            <th data-col="coles">
              <span class="store-chip coles sm">C</span> Coles Price <span class="sort-arrow"></span>
            </th>
            <th data-col="avg" style="text-align:center">Hist. Avg <span class="sort-arrow"></span></th>
          </tr>
        </thead>
        <tbody id="dealsBody"></tbody>
      </table>
    </div>
    <div id="dealsEmpty" class="deals-empty" style="display:none">
      <div class="deals-empty-icon">🛒</div>
      <div class="deals-empty-title">No hot deals right now</div>
      <div>Check back after prices are updated — deals appear when a price drops into the bottom 20% of its recorded history.</div>
    </div>
  </div>
</main>

<div id="priceTooltip" class="price-tooltip-fixed" style="display:none"></div>

<script>
// ── Shared utilities ──────────────────────────────────────────────────────────

function resolveImgUrl(imgData) {
  if (!imgData) return '';
  if (typeof imgData === 'object' && imgData.uri)
    return 'https://cdn.productimages.coles.com.au/productimages' + imgData.uri;
  if (typeof imgData !== 'string') return '';
  if (imgData.includes('/_next/image')) {
    try {
      const inner = new URL(imgData).searchParams.get('url');
      if (inner) return decodeURIComponent(inner);
    } catch {}
  }
  return imgData;
}

function loadPriorities() {
  try { return JSON.parse(localStorage.getItem('pw_priorities_v1') || '{}'); } catch { return {}; }
}

const fmt = (n) => n != null ? `$${Number(n).toFixed(2)}` : '—';
const fmtUnit = (price, unit) => {
  if (price == null) return '';
  if (!unit) return `${fmt(price)}/unit`;
  if (/^1\s*ea\b/i.test(unit.trim())) return '';
  const m = unit.match(/^\d*\.?\d*\s*(?:g|kg|ml|l|ea|pk|pack|each)\b/i);
  return m ? `${fmt(price)}/${m[0].trim()}` : fmt(price);
};

function clientPer100(result) {
  if (!result || result.price == null) return { value: null, label: '100g' };
  const price = result.price;
  const name  = result.name || '';
  const kgM = name.match(/(\d+(?:\.\d+)?)\s*kg\b/i);
  if (kgM) { const g = +kgM[1] * 1000; return { value: +(price * 100 / g).toFixed(2), label: '100g' }; }
  const gM = name.match(/(\d+(?:\.\d+)?)\s*g\b/i);
  if (gM && +gM[1] > 0) return { value: +(price * 100 / +gM[1]).toFixed(2), label: '100g' };
  const lM = name.match(/(\d+(?:\.\d+)?)\s*l(?:it(?:re|er)s?)?\b(?!\w)/i);
  if (lM) { const ml = +lM[1] * 1000; return { value: +(price * 100 / ml).toFixed(2), label: '100ml' }; }
  const mlM = name.match(/(\d+(?:\.\d+)?)\s*ml\b/i);
  if (mlM && +mlM[1] > 0) return { value: +(price * 100 / +mlM[1]).toFixed(2), label: '100ml' };
  const unit = (result.unit || '').toLowerCase().trim();
  const up = result.unit_price;
  if (up != null && unit) {
    const uM = unit.match(/^(\d*\.?\d*)?\s*(g|kg|ml|l)\b/);
    if (uM) {
      let qty = parseFloat(uM[1]) || 1.0;
      const uom = uM[2];
      if (uom === 'kg') qty *= 1000;
      else if (uom === 'l') qty *= 1000;
      if (qty > 0) return { value: +(up * 100 / qty).toFixed(2), label: (uom === 'ml' || uom === 'l') ? '100ml' : '100g' };
    }
  }
  return { value: null, label: '100g' };
}

const CATEGORY_REMAP = {
  'Fruit': 'Fruit & Veg', 'Vegetables': 'Fruit & Veg',
  'Bread & Bakery': 'Bakery', 'Frozen': 'Frozen Foods',
  'Snacks & Confectionery': 'Sweets', 'Snacks': 'Sweets',
  'Drinks': 'Drinks & Alcohol', 'Health & Beauty': 'Personal Care',
  'Spices & Herbs': 'Pantry', 'Spreads & Dips': 'Pantry',
  'Nuts & Seeds': 'Pantry',
};
function getCategory(item) {
  try { const ov = JSON.parse(localStorage.getItem('pw_categories_v1') || '{}'); if (ov[item.list_item]) return ov[item.list_item]; } catch {}
  const c = (item.category || '').trim();
  return CATEGORY_REMAP[c] || c || 'Other';
}

// ── Deal computation ──────────────────────────────────────────────────────────

function pricePercentile(prices, pct) {
  const sorted = [...prices].sort((a, b) => a - b);
  return sorted[Math.floor(sorted.length * pct)];
}

function getDealInfo(item) {
  const history = item.price_history;
  if (!history || history.length < 3) return null;
  const prices = history.map(h => h.price).filter(p => p > 0);
  if (prices.length < 3) return null;

  const mean = prices.reduce((s, p) => s + p, 0) / prices.length;
  const minHistoric = Math.min(...prices);
  const threshold = pricePercentile(prices, 0.20);

  const ww = item.woolworths?.price;
  const co = item.coles?.price;

  // Check each store separately
  const results = [];

  if (ww != null && ww <= threshold) {
    const pctOff = Math.max(0, Math.round((mean - ww) / mean * 100));
    const isAllTimeLow = ww <= minHistoric;
    results.push({ store: 'woolworths', price: ww, pctOff, mean, minHistoric, isAllTimeLow });
  }
  if (co != null && co <= threshold) {
    const pctOff = Math.max(0, Math.round((mean - co) / mean * 100));
    const isAllTimeLow = co <= minHistoric;
    results.push({ store: 'coles', price: co, pctOff, mean, minHistoric, isAllTimeLow });
  }

  if (!results.length) return null;

  // Return the best deal (highest % off)
  results.sort((a, b) => b.pctOff - a.pctOff);
  return results[0];
}

// ── Price bar ──────────────────────────────────────────────────────────────────

function buildPriceBar(itemName, priceHistory, currentPrice) {
  if (!priceHistory?.length || currentPrice == null) return '';
  const prices = priceHistory.map(p => p.price).filter(p => p > 0);
  if (prices.length < 2) return '';
  const minP = Math.min(...prices);
  const maxP = Math.max(...prices);
  if (minP === maxP) return '';
  const rawPos = ((currentPrice - minP) / (maxP - minP)) * 100;
  const pos = Math.max(0, Math.min(100, rawPos));

  const counts = {};
  prices.forEach(p => { const k = p.toFixed(2); counts[k] = (counts[k] || 0) + 1; });
  const total = prices.length;
  const lines = Object.entries(counts).sort(([a], [b]) => +a - +b)
    .map(([p, c]) => { const pct = Math.round(c / total * 100); return `$${p}  ${'█'.repeat(Math.round(pct / 10)).padEnd(10)}  ${pct}% (${c}×)`; });
  const cheaperPct = Math.round(prices.filter(p => p > currentPrice).length / total * 100);
  lines.push('');
  lines.push(cheaperPct > 0 ? `Now cheaper than ${cheaperPct}% of past prices ✓` : `Now at all-time low ✓`);
  const tooltip = lines.join('\n').replace(/"/g, '&quot;');

  return `<div class="price-bar-outer" data-tooltip="${tooltip}">
    <div class="price-bar"><div class="price-marker" style="left:${pos.toFixed(1)}%"></div></div>
    <div class="price-bar-labels"><span>${fmt(minP)}</span><span>${fmt(maxP)}</span></div>
  </div>`;
}

// ── State ─────────────────────────────────────────────────────────────────────

// sortKeys: ordered array of {col, dir} — first element is primary sort
let sortKeys = [{ col: 'deal', dir: 'desc' }];
let _activeCategory = 'All';
let _storeFilter = 'all';
let _data = null;

const COL_LABELS = {
  name: 'Product', deal: 'Deal %', ww: 'WW Price', coles: 'Coles Price',
  avg: 'Avg Price', category: 'Category',
};

// ── Sort ───────────────────────────────────────────────────────────────────────

function getSortValue(col, item, dealInfo) {
  switch (col) {
    case 'name':     return item.list_item.toLowerCase();
    case 'deal':     return dealInfo?.pctOff ?? -Infinity;
    case 'ww':       return item.woolworths?.price ?? Infinity;
    case 'coles':    return item.coles?.price ?? Infinity;
    case 'avg':      return dealInfo?.mean ?? Infinity;
    case 'category': return getCategory(item).toLowerCase();
    default:         return 0;
  }
}

function sortDeals(items) {
  return [...items].sort((a, b) => {
    const da = getDealInfo(a);
    const db = getDealInfo(b);
    for (const { col, dir } of sortKeys) {
      const mul = dir === 'asc' ? 1 : -1;
      const av = getSortValue(col, a, da);
      const bv = getSortValue(col, b, db);
      if (av < bv) return -1 * mul;
      if (av > bv) return  1 * mul;
    }
    return 0;
  });
}

function onColClick(col) {
  const existing = sortKeys.findIndex(k => k.col === col);
  if (existing === 0) {
    // Already primary — toggle direction
    sortKeys[0] = { col, dir: sortKeys[0].dir === 'asc' ? 'desc' : 'asc' };
  } else {
    // Prepend as new primary key; keep others as secondary (remove duplicate if present)
    const defaultDir = (col === 'name' || col === 'category') ? 'asc' : 'desc';
    const filtered = sortKeys.filter(k => k.col !== col);
    sortKeys = [{ col, dir: defaultDir }, ...filtered];
  }
  renderDeals();
}

// ── Filters ───────────────────────────────────────────────────────────────────

function filterDeals(allDeals) {
  return allDeals.filter(({ item }) => {
    if (_activeCategory !== 'All' && getCategory(item) !== _activeCategory) return false;
    if (_storeFilter === 'woolworths') {
      // WW must be the hot deal store
      const d = getDealInfo(item);
      if (d?.store !== 'woolworths') return false;
    }
    if (_storeFilter === 'coles') {
      const d = getDealInfo(item);
      if (d?.store !== 'coles') return false;
    }
    return true;
  });
}

// ── Category tabs ─────────────────────────────────────────────────────────────

function buildCategoryTabs(items) {
  const container = document.getElementById('categoryTabs');
  if (!container) return;
  const counts = {};
  items.forEach(item => { const c = getCategory(item); counts[c] = (counts[c] || 0) + 1; });
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([c]) => c);
  const cats = ['All', ...top];
  container.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = `category-tab${cat === _activeCategory ? ' active' : ''}`;
    btn.textContent = cat;
    btn.addEventListener('click', () => { _activeCategory = cat; renderDeals(); });
    container.appendChild(btn);
  });
}

function renderSortBar() {
  // No sort bar shown — multi-key sort works silently like Excel
}

// ── Render ─────────────────────────────────────────────────────────────────────

function renderDeals() {
  if (!_data) return;

  const priorities = loadPriorities();
  const items = ((_data.items || []).filter(item =>
    !item.archived && priorities[item.list_item] !== 'archive'
  ));

  // Collect all hot-deal items (may have deals at one or both stores)
  const allDeals = items
    .map(item => ({ item, deal: getDealInfo(item) }))
    .filter(({ deal }) => deal != null);

  buildCategoryTabs(allDeals.map(d => d.item));

  const filtered = filterDeals(allDeals);
  const sorted = sortDeals(filtered.map(d => d.item));

  // Hero stats
  const heroEl = document.getElementById('heroStats');
  if (heroEl) {
    const allTimeLowCount = allDeals.filter(({ deal }) => deal.isAllTimeLow).length;
    const showingAll = filtered.length === allDeals.length;
    heroEl.innerHTML = [
      showingAll
        ? `<div class="deals-hero-stat"><strong>${allDeals.length}</strong> deals found</div>`
        : `<div class="deals-hero-stat"><strong>${filtered.length}</strong> of <strong>${allDeals.length}</strong> deals shown</div>`,
      allTimeLowCount ? `<div class="deals-hero-stat"><strong>${allTimeLowCount}</strong> all-time lows 🏆</div>` : '',
    ].join('');
  }

  // Update sort headers
  const thead = document.getElementById('dealsHead');
  if (thead) {
    const primary = sortKeys[0];
    thead.querySelectorAll('th[data-col]').forEach(th => {
      const col = th.dataset.col;
      const arrow = th.querySelector('.sort-arrow');
      th.classList.toggle('sort-primary', col === primary?.col);
      if (arrow) arrow.textContent = col === primary?.col ? (primary.dir === 'asc' ? ' ↑' : ' ↓') : '';
    });
  }

  renderSortBar();

  const tbody = document.getElementById('dealsBody');
  const emptyEl = document.getElementById('dealsEmpty');
  tbody.innerHTML = '';

  if (!sorted.length) {
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  const overrides = (() => { try { return JSON.parse(localStorage.getItem('pw_overrides_v1') || '{}'); } catch { return {}; } })();

  sorted.forEach(item => {
    const deal = getDealInfo(item);
    if (!deal) return;

    const ww = item.woolworths;
    const co = item.coles;
    const ov = overrides[item.list_item] || {};
    const displayName = ov.displayName || item.list_item;
    const cat = getCategory(item);

    const imgSrc = resolveImgUrl(co?.image_url) || resolveImgUrl(ww?.image_url) || '';
    const imgHtml = imgSrc
      ? `<img class="deal-img" src="${imgSrc}" alt="" loading="lazy" onerror="this.style.display='none'" />`
      : '<div class="deal-img-placeholder"></div>';

    // Deal score cell
    const storeChip = deal.store === 'woolworths'
      ? '<span class="store-chip ww sm">W</span>'
      : '<span class="store-chip coles sm">C</span>';
    const pctClass = deal.store === 'woolworths' ? 'ww' : 'coles';
    const allTimeBadge = deal.isAllTimeLow
      ? '<div><span class="alltime-badge">all-time low 🏆</span></div>'
      : '';
    const dealCell = `
      <div class="deal-score-cell" style="text-align:center">
        ${storeChip}
        <div class="deal-pct ${pctClass}">${deal.pctOff}% off</div>
        ${allTimeBadge}
      </div>`;

    // WW cell
    const wwUrl = ov.wwUrl || ww?.url || null;
    const wwP100 = clientPer100(ww);
    let wwHtml = '';
    if (ww) {
      const link = wwUrl ? `<a href="${wwUrl}" target="_blank" class="price-link">${fmt(ww.price)}</a>` : fmt(ww.price);
      const fire = deal.store === 'woolworths' ? ' 🔥' : '';
      const unitStr = wwP100.value != null ? `$${wwP100.value.toFixed(2)}/${wwP100.label}` : fmtUnit(ww.unit_price, ww.unit);
      const nameTip = ww.name ? ` title="${ww.name.replace(/"/g, '&quot;')}"` : '';
      wwHtml = `<div class="deal-price-main"${nameTip}>${link}${fire}</div><div class="deal-price-unit">${unitStr}</div>`;
    } else {
      wwHtml = `<a href="https://www.woolworths.com.au/shop/search/products?searchTerm=${encodeURIComponent(item.list_item)}" target="_blank" class="search-link">Find →</a>`;
    }

    // Coles cell
    const coUrl = ov.colesUrl || co?.url || null;
    const coP100 = clientPer100(co);
    let coHtml = '';
    if (co) {
      const link = coUrl ? `<a href="${coUrl}" target="_blank" class="price-link">${fmt(co.price)}</a>` : fmt(co.price);
      const fire = deal.store === 'coles' ? ' 🔥' : '';
      const unitStr = coP100.value != null ? `$${coP100.value.toFixed(2)}/${coP100.label}` : fmtUnit(co.unit_price, co.unit);
      const nameTip = co.name ? ` title="${co.name.replace(/"/g, '&quot;')}"` : '';
      coHtml = `<div class="deal-price-main"${nameTip}>${link}${fire}</div><div class="deal-price-unit">${unitStr}</div>`;
    } else {
      coHtml = `<a href="https://www.coles.com.au/search?q=${encodeURIComponent(item.list_item)}" target="_blank" class="search-link">Find →</a>`;
    }

    // Avg price cell with price bar
    const currentPrice = deal.store === 'woolworths' ? ww?.price : co?.price;
    const bar = buildPriceBar(item.list_item, item.price_history, currentPrice);
    const avgCell = `<div style="text-align:center">
      <div style="font-size:12px;color:var(--text-soft)">${fmt(deal.mean)}</div>
      ${bar}
    </div>`;

    const wwClass  = deal.store === 'woolworths' ? 'cell-deal-ww' : '';
    const coClass  = deal.store === 'coles'      ? 'cell-deal-coles' : '';

    tbody.insertAdjacentHTML('beforeend', `<tr>
      <td class="item-name">
        <div class="deal-item-cell">
          ${imgHtml}
          <div>
            <div class="deal-item-name">${displayName}</div>
            <div class="deal-item-cat">${cat}</div>
          </div>
        </div>
      </td>
      <td>${dealCell}</td>
      <td class="${wwClass}">${wwHtml}</td>
      <td class="${coClass}">${coHtml}</td>
      <td>${avgCell}</td>
    </tr>`);
  });
}

// ── Tooltip ───────────────────────────────────────────────────────────────────

function initTooltip() {
  const tip = document.getElementById('priceTooltip');
  if (!tip) return;
  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest('.price-bar-outer[data-tooltip]');
    if (!el) return;
    tip.textContent = el.dataset.tooltip;
    tip.style.display = 'block';
  });
  document.addEventListener('mousemove', (e) => {
    if (tip.style.display === 'none') return;
    const margin = 12;
    const tipH = tip.offsetHeight, tipW = tip.offsetWidth;
    let top = e.clientY - tipH - margin;
    let left = e.clientX - tipW / 2;
    if (top < 8) top = e.clientY + margin;
    if (left < 8) left = 8;
    if (left + tipW > window.innerWidth - 8) left = window.innerWidth - tipW - 8;
    tip.style.top = `${top}px`;
    tip.style.left = `${left}px`;
  });
  document.addEventListener('mouseout', (e) => {
    if (e.target.closest('.price-bar-outer[data-tooltip]')) tip.style.display = 'none';
  });
}

// ── Store filter ──────────────────────────────────────────────────────────────

function initStoreFilter() {
  document.getElementById('storeFilter')?.querySelectorAll('.store-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      _storeFilter = btn.dataset.store;
      document.querySelectorAll('.store-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderDeals();
    });
  });
}

// ── Sort header clicks ────────────────────────────────────────────────────────

function initSortHeaders() {
  document.querySelectorAll('#dealsHead th[data-col]').forEach(th => {
    th.addEventListener('click', () => onColClick(th.dataset.col));
  });
  document.getElementById('sortClearBtn')?.addEventListener('click', () => {
    sortKeys = [{ col: 'deal', dir: 'desc' }];
    renderDeals();
  });
}

// ── Update Prices button ──────────────────────────────────────────────────────

function initRefreshBtn() {
  document.getElementById('refreshBtn')?.addEventListener('click', () => {
    const user  = localStorage.getItem('gh_user') || '';
    const repo  = localStorage.getItem('gh_repo') || '';
    const token = localStorage.getItem('gh_token') || '';
    if (!user || !repo || !token) {
      alert('Please configure GitHub settings on the main page (Auto-update Setup) first.');
      return;
    }
    fetch(`https://api.github.com/repos/${user}/${repo}/actions/workflows/scrape.yml/dispatches`, {
      method: 'POST',
      headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: 'main' }),
    }).then(r => {
      if (r.status === 204) alert('Scrape triggered! Prices will update in a few minutes.');
      else alert(`GitHub API error ${r.status}`);
    }).catch(e => alert(`Network error: ${e.message}`));
  });
}

// ── Init ───────────────────────────────────────────────────────────────────────

(async () => {
  try {
    const res = await fetch(`data/latest.json?t=${Date.now()}`);
    if (!res.ok) throw new Error('not found');
    _data = await res.json();
  } catch {
    document.getElementById('loading').textContent = 'Could not load price data. Try refreshing.';
    return;
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('dealsContainer').style.display = 'block';

  initSortHeaders();
  initStoreFilter();
  initTooltip();
  initRefreshBtn();
  renderDeals();
})();
</script>
</body>
</html>
