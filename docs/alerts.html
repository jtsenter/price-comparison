<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🔔 Price Alerts — PriceWatch</title>
  <meta name="description" content="Watched items that have just dropped below their usual price." />
  <meta name="theme-color" content="#00843D" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PriceWatch" />
  <link rel="apple-touch-icon" href="favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script>
  (function () {
    try {
      var t = localStorage.getItem('pw_theme') || 'light';
      var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
  </script>
  <link rel="stylesheet" href="style.css?v=75" />
  <style>
    .al-main { max-width: 900px; margin: 0 auto; padding: 20px 24px 60px; }

    .al-hero { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
    .al-hero-title { font-size: 22px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .al-hero-sub { font-size: 13px; color: var(--text-mid); margin-top: 4px; }
    .al-checked { font-size: 12px; color: var(--text-soft); margin-top: 8px; }
    .al-checked strong { color: var(--text-mid); font-weight: 600; }

    .al-summary { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
      background: var(--accent-soft, #EAF7EF); color: var(--accent, #00843D); font-size: 13px; font-weight: 700; }
    :root[data-theme="dark"] .al-summary { background: #0f2a1a; }

    .al-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }

    .al-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius, 12px);
      padding: 14px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; }
    .al-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--accent, #00843D); }
    .al-card.atl::before { background: #F59E0B; }

    .al-card-top { display: flex; gap: 12px; align-items: flex-start; }
    .al-img { width: 52px; height: 52px; border-radius: 8px; object-fit: contain; background: #fff; border: 1px solid var(--border); flex-shrink: 0; }
    .al-img-ph { width: 52px; height: 52px; border-radius: 8px; background: var(--bg); border: 1px solid var(--border); flex-shrink: 0; }
    .al-name { font-size: 14px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .al-cat { font-size: 11px; color: var(--text-soft); margin-top: 2px; }

    .al-reason { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start;
      font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px;
      background: var(--accent-soft, #EAF7EF); color: var(--accent, #00843D); }
    .al-card.atl .al-reason { background: #FEF3C7; color: #92400E; }
    :root[data-theme="dark"] .al-reason { background: #0f2a1a; }
    :root[data-theme="dark"] .al-card.atl .al-reason { background: #422006; color: #fcd34d; }

    .al-prices { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .al-now { font-size: 22px; font-weight: 800; color: var(--text); }
    .al-store-chip { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 6px; color: #fff; vertical-align: middle; }
    .al-store-chip.ww { background: var(--ww, #178841); }
    .al-store-chip.coles { background: var(--coles, #E01A22); }
    .al-usual { font-size: 13px; color: var(--text-soft); text-decoration: line-through; }
    .al-save { font-size: 12px; font-weight: 700; color: var(--accent, #00843D); }

    .al-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
    .al-per100 { font-size: 11px; color: var(--text-soft); }
    .al-link { font-size: 12px; font-weight: 600; color: var(--ww); text-decoration: none; white-space: nowrap; }
    .al-link:hover { text-decoration: underline; }

    .al-empty { text-align: center; padding: 60px 20px; color: var(--text-soft); }
    .al-empty-icon { font-size: 48px; margin-bottom: 12px; }
    .al-empty-msg { font-size: 15px; font-weight: 600; color: var(--text-mid); }
    .al-empty-sub { font-size: 13px; margin-top: 6px; }
    .al-empty-sub a { color: var(--ww); }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-left">
      <a href="index.html" class="brand">
        <span class="store-chip ww">W</span>
        <span class="store-chip coles">C</span>
        <span class="brand-name">PriceWatch</span>
      </a>
    </div>
    <div class="header-right">
      <a class="btn btn-ghost btn-icon nav-icon-btn nav-hot" href="hot-deals.html" title="Hot Deals">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"/></svg>
      </a>
      <a class="btn btn-ghost btn-icon nav-icon-btn nav-basket" href="shopping-list.html" title="Basket">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      </a>
      <a class="btn btn-ghost btn-icon nav-icon-btn nav-alerts here" href="alerts.html" title="Price Alerts">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      </a>
      <span class="header-div"></span>
      <button class="btn btn-ghost" id="alRefreshBtn" title="Reload alerts">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Refresh
      </button>
    </div>
  </div>
</header>

<main class="al-main">
  <div class="al-hero">
    <div>
      <div class="al-hero-title">🔔 Price Alerts</div>
      <div class="al-hero-sub">Items on your watchlist (👁) that have dropped below their usual price.</div>
      <div class="al-checked" id="alChecked"></div>
    </div>
    <div class="al-summary" id="alSummary" style="display:none"></div>
  </div>

  <div id="alList" class="al-grid"></div>
  <div id="alEmpty" class="al-empty" style="display:none"></div>
</main>

<script src="utils.js?v=56"></script>
<script>
'use strict';

// Watchlist + exclusions live in localStorage on the primary device; watchlist.json
// is the cross-device synced copy the scraper/UI write. Union both so a fresh device
// that only has the synced file still shows alerts.
function loadWatchlistLocal() {
  try { return new Set(JSON.parse(localStorage.getItem('pw_watchlist_v1') || '[]')); } catch { return new Set(); }
}
function loadExclusions() {
  try { return JSON.parse(localStorage.getItem('pw_exclusions_v1') || '{}'); } catch { return {}; }
}

function relTime(iso) {
  const t = Date.parse(iso);
  if (isNaN(t)) return '';
  const mins = Math.round((Date.now() - t) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins} min ago`;
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return `${hrs} hour${hrs !== 1 ? 's' : ''} ago`;
  const days = Math.round(hrs / 24);
  return `${days} day${days !== 1 ? 's' : ''} ago`;
}

function fmtWhen(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return d.toLocaleString(undefined, { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function storeUrl(item, store) {
  return (store === 'coles' ? item.coles : item.woolworths)?.url || '';
}
function storeImg(item, store) {
  return (store === 'coles' ? item.coles : item.woolworths)?.image_url
      || item.woolworths?.image_url || item.coles?.image_url || '';
}

async function render() {
  const listEl = document.getElementById('alList');
  const emptyEl = document.getElementById('alEmpty');
  const checkedEl = document.getElementById('alChecked');
  const summaryEl = document.getElementById('alSummary');
  listEl.innerHTML = '';
  emptyEl.style.display = 'none';
  summaryEl.style.display = 'none';

  let data;
  try {
    const res = await fetch(`data/latest.json?t=${Date.now()}`, { cache: 'no-store' });
    data = await res.json();
  } catch {
    emptyEl.innerHTML = '<div class="al-empty-icon">⚠️</div><div class="al-empty-msg">Could not load price data.</div>';
    emptyEl.style.display = 'block';
    return;
  }

  checkedEl.innerHTML = data.last_updated
    ? `Prices last checked <strong>${relTime(data.last_updated)}</strong> · ${fmtWhen(data.last_updated)}`
    : '';

  // Merge synced watchlist.json into the local set (union — never lose a watch).
  const watch = loadWatchlistLocal();
  try {
    const wr = await fetch(`data/watchlist.json?t=${Date.now()}`, { cache: 'no-store' });
    if (wr.ok) { const names = await wr.json(); if (Array.isArray(names)) names.forEach(n => watch.add(n)); }
  } catch {}

  if (watch.size === 0) {
    emptyEl.innerHTML = '<div class="al-empty-icon">👁</div><div class="al-empty-msg">You\'re not watching anything yet.</div>'
      + '<div class="al-empty-sub">Tap the 👁 icon on any item in the <a href="index.html">main list</a> to track its price. Drops show up here.</div>';
    emptyEl.style.display = 'block';
    return;
  }

  const excl = loadExclusions();
  const items = (data.items || []).filter(i => watch.has(i.list_item) && !i.archived);

  // Only the watched items currently at a genuine deal, best drop first.
  const deals = items
    .map(i => ({ item: i, dq: getDealQuality(i, excl) }))
    .filter(x => x.dq.qualifies)
    .sort((a, b) => (b.dq.isAllTimeLow - a.dq.isAllTimeLow) || (b.dq.dropPct - a.dq.dropPct));

  if (deals.length === 0) {
    emptyEl.innerHTML = '<div class="al-empty-icon">✅</div>'
      + `<div class="al-empty-msg">No price drops right now.</div>`
      + `<div class="al-empty-sub">All ${watch.size} watched item${watch.size !== 1 ? 's are' : ' is'} at or above their usual price. Check back after the next scrape.</div>`;
    emptyEl.style.display = 'block';
    return;
  }

  const totalSave = deals.reduce((s, x) => s + (x.dq.saveAmount || 0), 0);
  summaryEl.textContent = `🔥 ${deals.length} price drop${deals.length !== 1 ? 's' : ''} · save up to $${totalSave.toFixed(2)}`;
  summaryEl.style.display = 'inline-flex';

  listEl.innerHTML = deals.map(({ item, dq }) => {
    const store = dq.store;
    const img = storeImg(item, store);
    const url = storeUrl(item, store);
    const per = clientPer100({ price: dq.price, name: item.list_item,
      unit_price: (store === 'coles' ? item.coles : item.woolworths)?.unit_price,
      unit: (store === 'coles' ? item.coles : item.woolworths)?.unit });
    const perStr = per && per.value != null ? `$${per.value.toFixed(2)}/${per.label}` : '';
    const imgHtml = img
      ? `<img class="al-img" src="${escAttr(img)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'al-img-ph\\'></div>'">`
      : '<div class="al-img-ph"></div>';
    const linkHtml = url ? `<a class="al-link" href="${escAttr(url)}" target="_blank" rel="noopener">View ↗</a>` : '';
    return `
      <div class="al-card${dq.isAllTimeLow ? ' atl' : ''}">
        <div class="al-card-top">
          ${imgHtml}
          <div>
            <div class="al-name">${esc(item.list_item)}</div>
            <div class="al-cat">${esc(item.category || '')}</div>
          </div>
        </div>
        <span class="al-reason">${esc(dq.reason)}</span>
        <div class="al-prices">
          <span class="al-now">$${dq.price.toFixed(2)}</span>
          <span class="al-store-chip ${store === 'coles' ? 'coles' : 'ww'}">${store === 'coles' ? 'Coles' : 'Woolworths'}</span>
          ${dq.typical > dq.price ? `<span class="al-usual">usually $${dq.typical.toFixed(2)}</span>` : ''}
        </div>
        <div class="al-foot">
          <span class="al-save">${dq.saveAmount > 0 ? `Save $${dq.saveAmount.toFixed(2)}` : ''}${perStr ? `<span class="al-per100"> · ${perStr}</span>` : ''}</span>
          ${linkHtml}
        </div>
      </div>`;
  }).join('');
}

document.getElementById('alRefreshBtn').addEventListener('click', render);
render();
</script>
